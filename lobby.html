    <style>
        * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    <footer class="relative z-10 border-t border-white/5 py-6 text-center text-xs text-space-muted">

    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
    // ============================================================
    // 配置
    // ============================================================
    const API_BASE = 'https://roomfind.us.ci';  // Cloudflare Worker（房间登记）
    const HEARTBEAT_MS = 20000;   // 心跳间隔
    const STALE_MS = 60000;       // 超过 60s 无心跳视为过期

    // ============================================================
    // 状态
    // ============================================================
    let peer = null;
    let isHost = false;
    let myCode = '';
    let myName = '';
    let roomName = '';
    let connections = {};   // host: connId -> conn ; client: { host: conn }
    let heartbeatTimer = null;
    let roomId = null;      // 房主：是否已登记房间（用于删除/心跳）

    const $ = id => document.getElementById(id);

    // ============================================================
    // 工具
    // ============================================================
    function genCode(len = 5) {
        const a = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
        let s = '';
        for (let i = 0; i < len; i++) s += a[Math.floor(Math.random() * a.length)];
        return s;
    }
    function esc(s) {
        return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function nowTs() { return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }); }
    function setStatus(text) { $('lobby-status').textContent = text || ''; }
    function setRoomStatus(text) { $('room-status').textContent = text || ''; }

    // ============================================================
    // 房间列表（Cloudflare Worker）
    // ============================================================
    async function loadRooms() {
        try {
            const res = await fetch(API_BASE + '/rooms');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            renderRooms(Array.isArray(data) ? data : []);
        } catch (e) {
            $('room-list').innerHTML = `<p class="text-glow-pink text-sm text-center py-10">加载房间失败：${esc(e.message)}</p>`;
        }
    }

    function renderRooms(rooms) {
        $('room-count').textContent = rooms.length + ' 个';
        if (!rooms.length) {
            $('room-list').innerHTML = '<p class="text-space-muted text-sm text-center py-10">暂时没有房间，创建一个吧 👆</p>';
            return;
        }
        $('room-list').innerHTML = rooms.map(r => `
            <div class="spotlight-card rounded-xl p-4 flex items-center justify-between gap-4">
                <div class="min-w-0">
                    <h3 class="font-semibold text-space-text truncate">${esc(r.name)}</h3>
                    <p class="text-xs text-space-muted font-mono mt-1">
                        房主 ${esc(r.host)} · 房间码 <span class="text-glow-green">${esc(r.code)}</span>
                    </p>
                </div>
                <button data-join="${esc(r.code)}" data-name="${esc(r.name)}"
                    class="join-btn px-4 py-2 bg-glow-green/10 text-glow-green border border-glow-green/40 rounded-lg text-sm hover:bg-glow-green/20 transition whitespace-nowrap">
                    加入
                </button>
            </div>
        `).join('');
        document.querySelectorAll('.join-btn').forEach(btn => {
            btn.addEventListener('click', () => joinRoom(btn.dataset.join, btn.dataset.name));
        });
    }

    // ============================================================
    // 创建房间（房主）
    // ============================================================
    async function createRoom() {
        myName = ($('nickname').value || '').trim() || '房主';
        roomName = ($('room-name').value || '').trim() || (myName + ' 的房间');
        localStorage.setItem('lobby_nick', myName);

        setStatus('正在创建房间...');
        myCode = genCode();
        isHost = true;

        // 1. 登记房间到 Worker
        try {
            const res = await fetch(API_BASE + '/announce', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: myCode, name: roomName, host: myName })
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            roomId = myCode;
        } catch (e) {
            setStatus('创建失败：' + e.message);
            return;
        }

        // 2. 建立 PeerJS（房主 id = 房间码）
        try {
            peer = new Peer(myCode, { debug: 1 });
            await new Promise((res, rej) => {
                peer.on('open', res);
                peer.on('error', e => rej(new Error(e.type || 'peer error')));
                setTimeout(() => rej(new Error('信令超时（PeerJS 云端可能不可达，请稍后重试）')), 15000);
            });
        } catch (e) {
            await cleanupRoom();
            setStatus('创建失败：' + e.message);
            return;
        }

        // 3. 监听连接
        peer.on('connection', conn => {
            connections[conn.peer] = conn;
            conn.on('data', d => onHostData(conn, d));
            conn.on('close', () => {
                delete connections[conn.peer];
                addSys(`${conn.metadata?.name || '有人'} 离开了`);
                broadcastMembers();
            });
        });

        // 4. 心跳
        heartbeatTimer = setInterval(() => {
            if (!roomId) return;
            fetch(API_BASE + '/heartbeat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: roomId })
            }).catch(() => {});
        }, HEARTBEAT_MS);

        // 5. 进入房间视图
        enterRoomView('房主');
        addSys('房间已创建，把房间码告诉朋友吧');
    }

    // ============================================================
    // 加入房间（客户端）
    // ============================================================
    async function joinRoom(code, name) {
        myName = ($('nickname').value || '').trim() || '访客';
        localStorage.setItem('lobby_nick', myName);
        myCode = code; roomName = name; isHost = false;

        setStatus('正在连接房间 ' + code + ' ...');
        try {
            peer = new Peer({ debug: 1 });
            await new Promise((res, rej) => {
                peer.on('open', res);
                peer.on('error', e => rej(new Error(e.type || 'peer error')));
                setTimeout(() => rej(new Error('信令超时')), 15000);
            });
        } catch (e) {
            setStatus('连接失败：' + e.message);
            return;
        }

        const conn = peer.connect(code, { metadata: { name: myName } });
        conn.on('open', () => {
            connections.host = conn;
            setStatus('已连接，等待房主确认...');
            conn.send({ type: 'join', name: myName });
        });
        conn.on('data', d => onClientData(d));
        conn.on('close', () => { addSys('与房主的连接已断开'); setRoomStatus('连接已断开'); });
        conn.on('error', e => { addSys('连接错误：' + (e.type || e)); });
    }

    // ============================================================
    // 消息处理
    // ============================================================
    // 房主收到客户端消息
    function onHostData(conn, d) {
        if (!d || typeof d !== 'object') return;
        if (d.type === 'join') {
            const name = (d.name || '').trim() || '访客';
            // 收集房间内已有的昵称（含房主）
            const existing = [myName];
            for (const id in connections) {
                if (connections[id] === conn) continue;
                existing.push((connections[id].metadata && connections[id].metadata.name) || '访客');
            }
            if (existing.includes(name)) {
                try { conn.send({ type: 'reject', reason: '昵称「' + name + '」已被占用，请换一个' }); } catch (e) {}
                setTimeout(() => { try { conn.close(); } catch (e) {} }, 300);
                return;
            }
            conn.metadata = conn.metadata || {};
            conn.metadata.name = name;
            try { conn.send({ type: 'welcome' }); } catch (e) {}
            addSys(`${name} 加入了`);
            broadcastMembers();
        } else if (d.type === 'msg') {
            const from = (conn.metadata && conn.metadata.name) || '访客';
            addMsg(from, d.text, false);
            broadcast({ type: 'msg', from, text: d.text }, conn); // 转发给其他人
        } else if (d.type === 'game' && d.sub === 'action') {
            hostGameAction(conn, d);
        } else if (d.type === 'arena') {
            arOnNet(conn, d);
        }
    }
    // 客户端收到房主消息
    function onClientData(d) {
        if (!d || typeof d !== 'object') return;
        if (d.type === 'welcome') {
            enterRoomView('成员');
            addSys('已加入房间');
        }
        else if (d.type === 'msg') addMsg(d.from, d.text, false);
        else if (d.type === 'sys') addSys(d.text);
        else if (d.type === 'members') setRoomStatus('在线：' + d.list.join('、'));
        else if (d.type === 'game') clientGameData(d);
        else if (d.type === 'arena') arOnNet(connections.host || {}, d);
        else if (d.type === 'reject') {
            setStatus('加入失败：' + (d.reason || '昵称重复'));
            if (peer) { try { peer.destroy(); } catch (e) {} }
            peer = null; connections = {}; myCode = ''; roomName = '';
        }
    }

    function broadcast(obj, exceptConn) {
        for (const id in connections) {
            if (connections[id] === exceptConn) continue;
            try { connections[id].send(obj); } catch (e) {}
        }
    }
    function broadcastMembers() {
        const names = [myName];
        for (const id in connections) {
            const n = (connections[id].metadata && connections[id].metadata.name) || '访客';
            if (!names.includes(n)) names.push(n);
        }
        broadcast({ type: 'members', list: names });
        setRoomStatus('在线：' + names.join('、'));
    }

    function sendMsg() {
        const text = ($('msg-input').value || '').trim();
        if (!text) return;
        $('msg-input').value = '';
        addMsg(myName, text, true);
        if (isHost) broadcast({ type: 'msg', from: myName, text });
        else if (connections.host) connections.host.send({ type: 'msg', text });
    }

    // ============================================================
    // UI 渲染
    // ============================================================
    function addMsg(from, text, self) {
        const box = $('chat-box');
        const el = document.createElement('div');
        el.className = 'flex flex-col ' + (self ? 'items-end' : 'items-start');
        el.innerHTML = `
            <div class="text-[11px] text-space-muted mb-1 font-mono">${esc(from)} · ${nowTs()}</div>
            <div class="max-w-[75%] rounded-lg px-3.5 py-2 text-sm break-words ${self ? 'bg-glow-purple/20 border border-glow-purple/40' : 'bg-space-800 border border-space-border'}">${esc(text)}</div>
        `;
        box.appendChild(el);
        box.scrollTop = box.scrollHeight;
    }
    function addSys(text) {
        const box = $('chat-box');
        const el = document.createElement('div');
        el.className = 'text-center text-xs text-space-muted font-mono py-1';
        el.textContent = '— ' + text + ' —';
        box.appendChild(el);
        box.scrollTop = box.scrollHeight;
    }

    function enterRoomView(role) {
        $('lobby-view').classList.add('hidden');
        $('room-view').classList.remove('hidden');
        $('rv-name').textContent = roomName;
        $('rv-code').textContent = myCode;
        $('rv-role').textContent = '（' + role + '）';
        setStatus('');
    }

    async function leaveRoom() {
        // 房主：注销房间
        if (isHost && roomId) { try { await fetch(API_BASE + '/leave', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: roomId }) }); } catch (e) {} }
        if (heartbeatTimer) clearInterval(heartbeatTimer);
        if (peer) { try { peer.destroy(); } catch (e) {} }
        peer = null; connections = {}; roomId = null; heartbeatTimer = null;
        $('room-view').classList.add('hidden');
        $('lobby-view').classList.remove('hidden');
        $('chat-box').innerHTML = '';
        gameOverlayHide();
        GAME.active = false; if (GAME.timer) clearTimeout(GAME.timer);
        setRoomStatus('');
        loadRooms();
    }

    async function cleanupRoom() {
        if (heartbeatTimer) clearInterval(heartbeatTimer);
        if (roomId) { try { await fetch(API_BASE + '/leave', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: roomId }) }); } catch (e) {} }
        if (peer) { try { peer.destroy(); } catch (e) {} }
    }

    // ============================================================
    // 小游戏系统 v2 —— 100 款小游戏（数据驱动，6 种玩法模板）
    // 一局 5 轮，每轮抽取一款；开始前有抽取滚动动画
    // 房主权威：房主出题/收集/判定/广播；客户端只发动作、渲染
    // ============================================================

    const GAME_DEFS = [];
    (function buildGameDefs() {
        const push = o => GAME_DEFS.push(o);

        // ---- 反应速度 tap 20 ----
        [

    function gEsc(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]); }

    function gameSend(obj) {

    function allPlayerNames() {
        const names = [myName];
        for (const id in connections) names.push((connections[id].metadata && connections[id].metadata.name) || '访客');
        return names;
    }
    function connByName(name) {
        for (const id in connections) {
            if (((connections[id].metadata && connections[id].metadata.name) || '访客') === name) return connections[id];
        }
        return null;
    }
    function sendTo(name, obj) {
        if (name === myName) return;
        const c = connByName(name);
        if (c) { try { c.send(obj); } catch (e) {} }
    }

    // ---------- 抽取滚动动画 ----------
    function playDrawAnimation(def, cb) {
        gameOverlayShow();
        const ov = $('game-overlay');
        ov.innerHTML = gameHeader(
            '<div class="flex-1 flex flex-col items-center justify-center p-6 text-center">' +
            '<p class="text-xs text-space-muted font-mono mb-5">第 ' + GAME.roundIndex + ' / ' + GAME.totalRounds + ' 轮 · 抽取中…</p>' +
            '<div id="slot-emoji" class="text-7xl mb-4" style="transition:transform .3s">🎲</div>' +
            '<div id="slot-name" class="text-2xl font-bold text-space-text font-mono">…</div>' +
            '<p id="slot-tip" class="text-xs text-space-muted mt-6 h-4"></p>' +
            '</div>');
        $('game-close').addEventListener('click', () => gameOverlayHide());
        const emojiEl = $('slot-emoji'), nameEl = $('slot-name'), tipEl = $('slot-tip');
        const total = 18;
        let t = 0;
        function tick() {
            const rnd = GAME_DEFS[Math.floor(Math.random() * GAME_DEFS.length)];
            emojiEl.textContent = rnd.emoji;
            nameEl.textContent = rnd.name;
            t++;
            if (t < total) {
                setTimeout(tick, 40 + (t / total) * 110);
            } else {
                emojiEl.textContent = def.emoji;
                nameEl.textContent = def.name;
                emojiEl.style.transform = 'scale(1.4)';
                nameEl.style.color = '#3fb950';
                tipEl.textContent = '准备开始！';
                setTimeout(() => { if (cb) cb(); }, 650);
            }
        }
        tick();
    }
    // ---------- 房主：开始 / 下一轮 / 结束 ----------
    function hostStartGame() {
        if (!isHost) return;
        const players = allPlayerNames();
        GAME.active = true; GAME.roundIndex = 0; GAME.scores = {};
        players.forEach(p => GAME.scores[p] = 0);
        GAME.curDef = null;
        broadcast({ type: 'game', sub: 'start', total: GAME.totalRounds, scores: { ...GAME.scores } });
        renderGameStart(GAME.totalRounds);
    }

    function hostNextRound() {
        if (!GAME.active) return;
        GAME.roundIndex++;
        if (GAME.roundIndex > GAME.totalRounds) { hostEndGame(); return; }
        const pool = GAME_DEFS.filter(g => !GAME.curDef || g.id !== GAME.curDef.id);
        const def = pool[Math.floor(Math.random() * pool.length)];
        GAME.curDef = def;
        GAME.curData = null; GAME.collected = {}; GAME.roundResolved = false; GAME.word = null;
        broadcast({ type: 'game', sub: 'round', def: { id: def.id, name: def.name, emoji: def.emoji, type: def.type }, round: GAME.roundIndex, total: GAME.totalRounds, scores: { ...GAME.scores } });
        playDrawAnimation(def, () => {
            broadcast({ type: 'game', sub: 'phase', phase: 'begin' });
            startRoundByType(def);
        });
    }

    function startRoundByType(def) {
        if (def.type === 'tap') hostTap(def);
        else if (def.type === 'quiz') hostQuiz(def);
        else if (def.type === 'math') hostMath(def);
        else if (def.type === 'rps') hostRps(def);
        else if (def.type === 'bomb') hostBomb(def);
        else if (def.type === 'draw') hostDraw(def);
    }

    function hostEndGame() {
        GAME.active = false;
        broadcast({ type: 'game', sub: 'over', scores: { ...GAME.scores } });
        renderGameOver(GAME.scores);
    }

    function resolveRound(msg) {
        GAME.roundResolved = true;
        clearTimeout(GAME.timer);
        broadcast({ type: 'game', sub: 'phase', phase: 'result', text: msg, scores: { ...GAME.scores } });
        renderGameResult(msg, GAME.scores);
    }

    // ---------- tap ----------
    function hostTap(def) {
        renderTap('prepare', def);
        const delay = def.waitMin + Math.random() * (def.waitMax - def.waitMin);
        GAME.timer = setTimeout(() => {
            GAME.roundStart = Date.now();
            GAME.collected = {};
            broadcast({ type: 'game', sub: 'phase', phase: 'go', ts: GAME.roundStart });
            renderTap('go', def);
            GAME.timer = setTimeout(() => hostResolveTap(def), def.windowMs);
        }, delay);
    }
    function hostResolveTap(def) {
        if (GAME.roundResolved) return;
        let best = null, bestT = Infinity;
        for (const n in GAME.collected) { if (GAME.collected[n] < bestT) { bestT = GAME.collected[n]; best = n; } }
        let msg;
        if (best) { GAME.scores[best] = (GAME.scores[best] || 0) + 1; msg = best + ' 最快（' + bestT + 'ms）'; }
        else msg = '无人响应';
        resolveRound(msg);
    }

    // ---------- quiz ----------
    function hostQuiz(def) {
        GAME.collected = {};
        broadcast({ type: 'game', sub: 'phase', phase: 'quiz', q: def.q, opts: def.opts });
        renderQuiz(def);
        GAME.timer = setTimeout(() => hostResolveQuiz(def), 12000);
    }
    function hostResolveQuiz(def) {
        if (GAME.roundResolved) return;
        let winner = null, bestT = Infinity;
        for (const n in GAME.collected) {
            const c = GAME.collected[n];
            if (c.value === def.ans && c.t < bestT) { bestT = c.t; winner = n; }
        }
        const right = def.opts[def.ans];
        let msg;
        if (winner) { GAME.scores[winner] = (GAME.scores[winner] || 0) + 1; msg = winner + ' 答对：' + right; }
        else msg = '无人答对，正确答案：' + right;
        resolveRound(msg);
    }

    // ---------- math ----------
    function hostMath(def) {
        const rnd = (min, max) => min + Math.floor(Math.random() * (max - min + 1));
        let a, b, ans, expr;
        if (def.op === 'mix') {
            a = rnd(def.aMin, def.aMax); b = rnd(def.bMin, def.bMax);
            if (Math.random() < 0.5) { expr = a + ' + ' + b; ans = a + b; }
            else { if (a < b) { const t = a; a = b; b = t; } expr = a + ' - ' + b; ans = a - b; }
        } else if (def.op === '×') {
            a = rnd(def.aMin, def.aMax); b = rnd(def.bMin, def.bMax);
            expr = a + ' × ' + b; ans = a * b;
        } else if (def.op === '-') {
            a = rnd(def.aMin, def.aMax); b = rnd(def.bMin, def.bMax);
            if (a < b) { const t = a; a = b; b = t; }
            expr = a + ' - ' + b; ans = a - b;
        } else {
            a = rnd(def.aMin, def.aMax); b = rnd(def.bMin, def.bMax);
            expr = a + ' + ' + b; ans = a + b;
        }
        GAME.curData = { expr: expr, ans: ans };
        GAME.collected = {};
        broadcast({ type: 'game', sub: 'phase', phase: 'math', expr: expr });
        renderMathGame(def, expr);
        GAME.timer = setTimeout(() => hostResolveMathGame(), 12000);
    }
    function hostResolveMathGame() {
        if (GAME.roundResolved) return;
        let winner = null, bestT = Infinity;
        for (const n in GAME.collected) {
            const c = GAME.collected[n];
            if (c.value === GAME.curData.ans && c.t < bestT) { bestT = c.t; winner = n; }
        }
        let msg;
        if (winner) { GAME.scores[winner] = (GAME.scores[winner] || 0) + 1; msg = winner + ' 答对：' + GAME.curData.ans; }
        else msg = '无人答对，答案：' + GAME.curData.ans;
        resolveRound(msg);
    }

    // ---------- rps ----------
    function hostRps(def) {
        const hands = ['rock', 'paper', 'scissors'];
        GAME.curData = { hostHand: hands[Math.floor(Math.random() * 3)] };
        GAME.collected = {};
        broadcast({ type: 'game', sub: 'phase', phase: 'rps' });
        renderRpsGame(def);

    }
    function hostResolveRps(def) {
        if (GAME.roundResolved) return;
        const hostHand = GAME.curData.hostHand;
        const beats = { rock: 'scissors', paper: 'rock', scissors: 'paper' };
        const winners = [];
        for (const n in GAME.collected) { if (beats[GAME.collected[n]] === hostHand) winners.push(n); }
        winners.forEach(w => GAME.scores[w] = (GAME.scores[w] || 0) + 1);
        const hn = { rock: '石头', paper: '布', scissors: '剪刀' }[hostHand];
        const msg = '房主出「' + hn + '」，' + (winners.length ? winners.join('、') + ' 获胜' : '无人获胜');
        resolveRound(msg);
    }

    // ---------- bomb ----------
    function hostBomb(def) {
        const answer = def.lo + Math.floor(Math.random() * (def.hi - def.lo + 1));
        const players = allPlayerNames();
        GAME.curData = { answer: answer, lo: def.lo, hi: def.hi, order: players, turnIdx: 0, turn: players[0] };
        GAME.collected = {};
        broadcast({ type: 'game', sub: 'phase', phase: 'bomb-turn', round: GAME.roundIndex, total: GAME.totalRounds, lo: def.lo, hi: def.hi, turn: GAME.curData.turn });
        renderBomb(def, def.lo, def.hi, GAME.curData.turn, null);
    }
    function hostBombGuess(name, value) {
        if (!GAME.curDef || GAME.curDef.type !== 'bomb' || GAME.roundResolved) return;
        if (name !== GAME.curData.turn) return;
        if (isNaN(value) || value < GAME.curData.lo || value > GAME.curData.hi) return;
        const ans = GAME.curData.answer;
        if (value === ans) {
            const msg = name + ' 踩到炸弹（' + ans + '）！其他玩家各得 1 分';
            GAME.curData.order.forEach(p => { if (p !== name) GAME.scores[p] = (GAME.scores[p] || 0) + 1; });
            resolveRound(msg);
            return;
        }
        if (value < ans) GAME.curData.lo = Math.max(GAME.curData.lo, value + 1);
        else GAME.curData.hi = Math.min(GAME.curData.hi, value - 1);
        GAME.curData.turnIdx = (GAME.curData.turnIdx + 1) % GAME.curData.order.length;
        GAME.curData.turn = GAME.curData.order[GAME.curData.turnIdx];
        const last = name + ' 猜了 ' + value;
        broadcast({ type: 'game', sub: 'phase', phase: 'bomb-turn', round: GAME.roundIndex, total: GAME.totalRounds, lo: GAME.curData.lo, hi: GAME.curData.hi, turn: GAME.curData.turn, last: last });
        renderBomb(GAME.curDef, GAME.curData.lo, GAME.curData.hi, GAME.curData.turn, last);
    }

    // ---------- draw ----------
    function hostDraw(def) {
        const players = allPlayerNames();
        GAME.drawer = players[Math.floor(Math.random() * players.length)];
        GAME.word = def.words[Math.floor(Math.random() * def.words.length)];
        GAME.collected = {};
        broadcast({ type: 'game', sub: 'phase', phase: 'draw-start', drawer: GAME.drawer, round: GAME.roundIndex, total: GAME.totalRounds });
        if (GAME.drawer === myName) renderDrawGame('drawer', GAME.word, def);
        else {
            sendTo(GAME.drawer, { type: 'game', sub: 'phase', phase: 'you-draw', word: GAME.word });
            renderDrawGame('guesser', null, def);
        }
        GAME.timer = setTimeout(() => hostResolveDraw(), 50000);
    }
    function hostResolveDraw() {
        if (GAME.roundResolved) return;
        let msg;
        if (GAME.collected.__winner__) {
            const w = GAME.collected.__winner__;
            GAME.scores[w] = (GAME.scores[w] || 0) + 1;
            GAME.scores[GAME.drawer] = (GAME.scores[GAME.drawer] || 0) + 1;
            msg = w + ' 猜对「' + GAME.word + '」，' + GAME.drawer + ' 同得 1 分';
        } else msg = '无人猜对，答案「' + GAME.word + '」';
        resolveRound(msg);
    }
    // ---------- 房主：处理客户端动作 ----------
    function hostGameAction(conn, d) {
        const name = (conn.metadata && conn.metadata.name) || '访客';
        const t = GAME.curDef ? GAME.curDef.type : null;
        if (t === 'tap' && d.action === 'tap' && !(name in GAME.collected)) {
            GAME.collected[name] = Date.now() - GAME.roundStart;
            if (Object.keys(GAME.collected).length >= Object.keys(connections).length + 1) {
                clearTimeout(GAME.timer);
                hostResolveTap(GAME.curDef);
            }
        } else if (t === 'quiz' && d.action === 'quiz' && !(name in GAME.collected)) {
            GAME.collected[name] = { value: d.value, t: Date.now() };
            if (d.value === GAME.curDef.ans) {
                clearTimeout(GAME.timer);
                hostResolveQuiz(GAME.curDef);
            }
        } else if (t === 'math' && d.action === 'answer' && !(name in GAME.collected)) {
            GAME.collected[name] = { value: d.value, t: Date.now() };
            if (d.value === GAME.curData.ans) {
                clearTimeout(GAME.timer);
                hostResolveMathGame();
            }
        } else if (t === 'rps' && d.action === 'rps' && !(name in GAME.collected)) {
            GAME.collected[name] = d.value;
            if (Object.keys(GAME.collected).length >= Object.keys(connections).length) {
                clearTimeout(GAME.timer);
                hostResolveRps(GAME.curDef);
            }
        } else if (t === 'bomb' && d.action === 'bomb-guess') {
            hostBombGuess(name, parseInt(d.value, 10));
        } else if (t === 'draw') {
            if (d.action === 'guess' && name !== GAME.drawer && !GAME.collected.__winner__) {
                if ((d.value || '').trim() === GAME.word) {
                    GAME.collected.__winner__ = name;
                    clearTimeout(GAME.timer);
                    hostResolveDraw();
                } else {
                    broadcast({ type: 'game', sub: 'phase', phase: 'wrong-guess', text: name + ' 猜「' + (d.value || '') + '」' });
                    const wl = document.getElementById('draw-log'); if (wl) wl.textContent = name + ' 猜「' + (d.value || '') + '」';
                }
            } else if (d.action === 'stroke' && name === GAME.drawer) {
                drawAddSeg(d.value);
                broadcast({ type: 'game', sub: 'phase', phase: 'stroke', seg: d.value });
            } else if (d.action === 'clear' && name === GAME.drawer) {
                drawClear();
                broadcast({ type: 'game', sub: 'phase', phase: 'clear' });
            }
        }
    }

    // ---------- 客户端：处理房主广播 ----------
    function clientGameData(d) {
        if (d.sub === 'start') {
            GAME.active = true; GAME.roundIndex = 0; GAME.scores = d.scores || {}; GAME.curDef = null;
            renderGameStart(d.total);
        } else if (d.sub === 'round') {
            GAME.curDef = d.def; GAME.roundIndex = d.round; GAME.totalRounds = d.total; GAME.scores = d.scores || {};
            GAME.curData = null; GAME.collected = {}; GAME.roundResolved = false;
            if (d.def) playDrawAnimation(d.def, null);
        } else if (d.sub === 'phase') {
            if (d.phase === 'begin') { /* 动画结束后由后续 phase 接管 */ }
            else if (d.phase === 'go') { GAME.roundStart = d.ts; renderTap('go', GAME.curDef); }
            else if (d.phase === 'quiz') renderQuiz({ q: d.q, opts: d.opts, name: GAME.curDef && GAME.curDef.name, emoji: GAME.curDef && GAME.curDef.emoji });
            else if (d.phase === 'math') renderMathGame(GAME.curDef, d.expr);
            else if (d.phase === 'rps') renderRpsGame(GAME.curDef);
            else if (d.phase === 'bomb-turn') { if (d.round) GAME.roundIndex = d.round; if (d.total) GAME.totalRounds = d.total; renderBomb(GAME.curDef, d.lo, d.hi, d.turn, d.last); }
            else if (d.phase === 'draw-start') { GAME.drawer = d.drawer; renderDrawGame(GAME.drawer === myName ? 'drawer' : 'guesser', null, GAME.curDef); }
            else if (d.phase === 'you-draw') { GAME.drawer = myName; GAME.word = d.word; renderDrawGame('drawer', d.word, GAME.curDef); }
            else if (d.phase === 'stroke') drawAddSeg(d.seg);
            else if (d.phase === 'clear') drawClear();
            else if (d.phase === 'wrong-guess') { const el = document.getElementById('draw-log'); if (el) el.textContent = d.text; }
            else if (d.phase === 'result') { GAME.scores = d.scores || GAME.scores; renderGameResult(d.text, GAME.scores); }
        } else if (d.sub === 'over') {
            GAME.active = false; renderGameOver(d.scores);
        }
    }

    // ---------- 房主自身动作 ----------
    function hostSelfAction(action, value) {
        const t = GAME.curDef ? GAME.curDef.type : null;
        if (t === 'tap' && action === 'tap' && !(myName in GAME.collected)) {
            GAME.collected[myName] = Date.now() - GAME.roundStart;
        } else if (t === 'quiz' && action === 'quiz' && !(myName in GAME.collected)) {
            GAME.collected[myName] = { value: value, t: Date.now() };
            if (value === GAME.curDef.ans) { clearTimeout(GAME.timer); hostResolveQuiz(GAME.curDef); }
        } else if (t === 'math' && action === 'answer' && !(myName in GAME.collected)) {
            GAME.collected[myName] = { value: value, t: Date.now() };
            if (value === GAME.curData.ans) { clearTimeout(GAME.timer); hostResolveMathGame(); }
        } else if (t === 'rps' && action === 'rps' && !(myName in GAME.collected)) {
            GAME.collected[myName] = value;
        } else if (t === 'bomb' && action === 'bomb-guess') {
            hostBombGuess(myName, parseInt(value, 10));
        } else if (t === 'draw') {
            if (action === 'guess' && myName !== GAME.drawer && !GAME.collected.__winner__) {
                if ((value || '').trim() === GAME.word) { GAME.collected.__winner__ = myName; clearTimeout(GAME.timer); hostResolveDraw(); }
                else { broadcast({ type: 'game', sub: 'phase', phase: 'wrong-guess', text: myName + ' 猜「' + (value || '') + '」' }); const wl = document.getElementById('draw-log'); if (wl) wl.textContent = myName + ' 猜「' + (value || '') + '」'; }
            } else if (action === 'stroke' && myName === GAME.drawer) {
                broadcast({ type: 'game', sub: 'phase', phase: 'stroke', seg: value });
            } else if (action === 'clear' && myName === GAME.drawer) {
                broadcast({ type: 'game', sub: 'phase', phase: 'clear' });
            }
        }
    }

    function playerAct(action, value) {
        if (isHost) hostSelfAction(action, value);
        else gameSend({ type: 'game', sub: 'action', action: action, value: value });
    }

    // draw
    let drawCtx = null, drawDrawing = false, drawIsDrawer = false;
    function drawClear() {
        const cv = document.getElementById('draw-canvas');
        if (!cv || !drawCtx) return;
        drawCtx.clearRect(0, 0, cv.width, cv.height);
    }
    function drawAddSeg(seg) {
        const cv = document.getElementById('draw-canvas');
        if (!cv || !drawCtx || !seg) return;
        drawCtx.strokeStyle = '#f0f6fc';
        drawCtx.lineWidth = 3;
        drawCtx.lineCap = 'round';
        drawCtx.beginPath();
        drawCtx.moveTo(seg[0] * cv.width, seg[1] * cv.height);
        drawCtx.lineTo(seg[2] * cv.width, seg[3] * cv.height);
        drawCtx.stroke();
    }
    function drawInitCanvas() {
        const cv = document.getElementById('draw-canvas');
        if (!cv) return;
        const rect = cv.parentElement.getBoundingClientRect();
        cv.width = Math.floor(rect.width);
        cv.height = Math.floor(rect.height);
        drawCtx = cv.getContext('2d');
        drawCtx.fillStyle = '#0d1117';
        drawCtx.fillRect(0, 0, cv.width, cv.height);
        if (!drawIsDrawer) return;
        let last = null;
        const pos = (e) => {
            const r = cv.getBoundingClientRect();
            const p = e.touches ? e.touches[0] : e;
            return [(p.clientX - r.left) / r.width, (p.clientY - r.top) / r.height];
        };
        const down = (e) => { e.preventDefault(); drawDrawing = true; last = pos(e); };
        const move = (e) => {
            if (!drawDrawing) return;
            e.preventDefault();
            const cur = pos(e);
            const seg = [last[0], last[1], cur[0], cur[1]];
            drawAddSeg(seg);
            playerAct('stroke', seg);
            last = cur;
        };
        const up = () => { drawDrawing = false; };
        cv.addEventListener('mousedown', down);
        cv.addEventListener('mousemove', move);
        cv.addEventListener('mouseup', up);
        cv.addEventListener('mouseleave', up);
        cv.addEventListener('touchstart', down, { passive: false });
        cv.addEventListener('touchmove', move, { passive: false });
        cv.addEventListener('touchend', up);
    }

    const AR_CFG = {
        PLAYER_R: 13, PLAYER_SPEED: 180, PLAYER_HP: 100,
        BULLET_SPEED: 620, BULLET_LIFE: 1.6, BULLET_DMG: 22, BULLET_R: 3,
        FIRE_CD: 0.22,
        ENEMY_R: 13, ENEMY_SPEED: 95, ENEMY_HP: 60, ENEMY_VIEW: 260,
        ENEMY_FIRE_CD: 0.9, ENEMY_DMG: 12,
        ROOM_W: 330, ROOM_H: 260, WALL_T: 14,
        NET_HZ: 20, INPUT_HZ: 30,
        ROUND_TIME: 90,
    };

    // ---------- 工具 ----------
    function arRnd(a, b) { return a + Math.random() * (b - a); }
    function arClamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
    function arDist(ax, ay, bx, by) { return Math.hypot(bx - ax, by - ay); }
    function arCircleRect(cx, cy, r, rect) {
        const nx = arClamp(cx, rect.x, rect.x + rect.w);
        const ny = arClamp(cy, rect.y, rect.y + rect.h);
        return (cx - nx) * (cx - nx) + (cy - ny) * (cy - ny) < r * r;
    }

    // ---------- 地图生成（房主）----------
    function arBuildMap(cols, rows) {
        const cw = AR_CFG.ROOM_W, ch = AR_CFG.ROOM_H, T = AR_CFG.WALL_T;
        const W = cols * cw, H = rows * ch;
        const walls = [];
        // 外墙
        walls.push({ x: 0, y: 0, w: W, h: T });
        walls.push({ x: 0, y: H - T, w: W, h: T });
        walls.push({ x: 0, y: 0, w: T, h: H });
        walls.push({ x: W - T, y: 0, w: T, h: H });

        const doors = [];
        // 内部隔墙：每格右边、下边（若是边界则跳过）
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                // 右边墙
                if (c < cols - 1) {
                    const x = (c + 1) * cw - T / 2;
                    const y0 = r * ch;
                    const hasDoor = Math.random() < 0.75;
                    if (hasDoor) {
                        const gapY = y0 + arRnd(50, ch - 50 - 70);
                        walls.push({ x, y: y0, w: T, h: gapY - y0 });
                        walls.push({ x, y: gapY + 70, w: T, h: y0 + ch - (gapY + 70) });
                        doors.push({ x: x - 2, y: gapY, w: T + 4, h: 70, vert: true, open: false });
                    } else {
                        walls.push({ x, y: y0, w: T, h: ch });
                    }
                }
                // 下边墙
                if (r < rows - 1) {
                    const y = (r + 1) * ch - T / 2;
                    const x0 = c * cw;
                    const hasDoor = Math.random() < 0.75;
                    if (hasDoor) {
                        const gapX = x0 + arRnd(50, cw - 50 - 70);
                        walls.push({ x: x0, y, w: gapX - x0, h: T });
                        walls.push({ x: gapX + 70, y, w: x0 + cw - (gapX + 70), h: T });
                        doors.push({ x: gapX, y: y - 2, w: 70, h: T + 4, vert: false, open: false });
                    } else {
                        walls.push({ x: x0, y, w: cw, h: T });
                    }
                }
            }
        }

        // 出生房（左下角）—— 相邻门标记 secure（敌人不开）
        const spawnC = 0, spawnR = rows - 1;
        const spawnRect = { x: spawnC * cw + T, y: spawnR * ch + T, w: cw - T * 2, h: ch - T * 2 };
        // 标记与出生房相邻的门
        for (const d of doors) {
            const cx = d.x + d.w / 2, cy = d.y + d.h / 2;
            const scx = spawnC * cw + cw / 2, scy = spawnR * ch + ch / 2;
            // 门在出生房边界上
            const onLeft = Math.abs(cx - (spawnC * cw)) < 6 && Math.abs(cy - scy) < ch / 2;
            const onRight = Math.abs(cx - ((spawnC + 1) * cw)) < 6 && Math.abs(cy - scy) < ch / 2;
            const onTop = Math.abs(cy - (spawnR * ch)) < 6 && Math.abs(cx - scx) < cw / 2;
            const onBottom = Math.abs(cy - ((spawnR + 1) * ch)) < 6 && Math.abs(cx - scx) < cw / 2;
            if (onLeft || onRight || onTop || onBottom) d.secure = true;
        }

        // 敌人出生点（其他房间中心附近）
        const enemySpawns = [];
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (c === spawnC && r === spawnR) continue;
                enemySpawns.push({ x: c * cw + cw / 2, y: r * ch + ch / 2 });
            }
        }

        return { cols, rows, cw, ch, W, H, walls, doors, spawnRect, enemySpawns };
    }

    // ---------- 碰撞 ----------
    function arBlocked(x, y, r) {
        if (!AR.map) return true;
        for (const w of AR.map.walls) if (arCircleRect(x, y, r, w)) return true;
        for (const d of AR.map.doors) if (!d.open && arCircleRect(x, y, r, d)) return true;
        return false;
    }
    function arMoveUnit(u, dx, dy, r) {
        let nx = u.x + dx, ny = u.y + dy;
        if (!arBlocked(nx, u.y, r)) u.x = nx;
        if (!arBlocked(u.x, ny, r)) u.y = ny;
    }

    // ---------- 视线（简化为无遮挡检测，性能优先）----------
    function arLineClear(x1, y1, x2, y2) {
        const steps = Math.ceil(arDist(x1, y1, x2, y2) / 22);
        for (let i = 1; i < steps; i++) {
            const t = i / steps;
            const px = x1 + (x2 - x1) * t, py = y1 + (y2 - y1) * t;
            for (const w of AR.map.walls) if (arCircleRect(px, py, 2, w)) return false;
            for (const d of AR.map.doors) if (!d.open && arCircleRect(px, py, 2, d)) return false;
        }
        return true;
    }

    // ---------- 开火 ----------
    function arFire(shooter, owner, isPlayer) {
        const cfg = AR_CFG;
        const bx = shooter.x + Math.cos(shooter.angle) * 16;
        const by = shooter.y + Math.sin(shooter.angle) * 16;
        AR.bullets.push({
            x: bx, y: by,
            vx: Math.cos(shooter.angle) * cfg.BULLET_SPEED,
            vy: Math.sin(shooter.angle) * cfg.BULLET_SPEED,
            owner: owner,           // 'me' | peerName | 'enemy'
            fromPlayer: !!isPlayer,
            life: cfg.BULLET_LIFE,
            dmg: isPlayer ? cfg.BULLET_DMG : cfg.ENEMY_DMG,
        });
    }

    // ---------- 更新（房主权威 / 单人）----------
    function arUpdateWorld(dt) {
        const cfg = AR_CFG;

        // 本地玩家移动
        const me = AR.me;
        if (me && me.alive) {
            let dx = 0, dy = 0;
            if (AR.keys['w'] || AR.keys['arrowup']) dy -= 1;
            if (AR.keys['s'] || AR.keys['arrowdown']) dy += 1;
            if (AR.keys['a'] || AR.keys['arrowleft']) dx -= 1;
            if (AR.keys['d'] || AR.keys['arrowright']) dx += 1;
            if (dx || dy) {
                const L = Math.hypot(dx, dy);
                const sp = cfg.PLAYER_SPEED * dt;
                arMoveUnit(me, dx / L * sp, dy / L * sp, cfg.PLAYER_R);
            }
            // 朝向鼠标
            const mw = arScreenToWorld(AR.mouse.x, AR.mouse.y);
            me.angle = Math.atan2(mw.y - me.y, mw.x - me.x);
            // 射击
            me.fireCd = Math.max(0, me.fireCd - dt);
            if (AR.mouse.down && me.fireCd <= 0) {
                me.fireCd = cfg.FIRE_CD;
                // guest 不本地生成子弹（避免与房主权威子弹重复），只发 input，由快照驱动
                if (AR.role === 'guest') {
                    arSendInput();   // 立即上行，让房主尽快生成子弹
                } else {
                    arFire(me, 'me', true);
                }
            }
        }

        // 敌人 AI（仅房主模拟）
        if (AR.role === 'host') {
            for (const e of AR.enemies) {
                if (e.hp <= 0) continue;
                e.fireCd = Math.max(0, e.fireCd - dt);
                // 找最近的可视目标
                let target = null, bestD = Infinity;
                const candidates = [{ x: AR.me.x, y: AR.me.y, alive: AR.me.alive, name: 'me' }];
                for (const n in AR.peers) {
                    const p = AR.peers[n];
                    if (p.alive) candidates.push({ x: p.x, y: p.y, alive: true, name: n });
                }
                for (const c of candidates) {
                    if (!c.alive) continue;
                    const d = arDist(e.x, e.y, c.x, c.y);
                    if (d < cfg.ENEMY_VIEW && d < bestD && arLineClear(e.x, e.y, c.x, c.y)) {
                        bestD = d; target = c;
                    }
                }
                if (target) {
                    // 追击并射击
                    const ang = Math.atan2(target.y - e.y, target.x - e.x);
                    e.angle = ang;
                    if (bestD > 150) {
                        const sp = cfg.ENEMY_SPEED * dt;
                        arMoveUnit(e, Math.cos(ang) * sp, Math.sin(ang) * sp, cfg.ENEMY_R);
                    }
                    if (e.fireCd <= 0) {
                        e.fireCd = cfg.ENEMY_FIRE_CD;
                        arFire(e, 'enemy', false);
                    }
                } else {
                    // 巡逻：朝巡逻点移动
                    if (!e.patrol) e.patrol = { x: e.x + arRnd(-120, 120), y: e.y + arRnd(-120, 120), t: 0 };
                    e.patrol.t += dt;
                    if (e.patrol.t > 4 || arDist(e.x, e.y, e.patrol.x, e.patrol.y) < 20) {
                        e.patrol = { x: e.x + arRnd(-150, 150), y: e.y + arRnd(-150, 150), t: 0 };
                    }
                    const ang = Math.atan2(e.patrol.y - e.y, e.patrol.x - e.x);
                    e.angle = ang;
                    const sp = cfg.ENEMY_SPEED * 0.5 * dt;
                    arMoveUnit(e, Math.cos(ang) * sp, Math.sin(ang) * sp, cfg.ENEMY_R);
                }
            }
        }

        // 子弹（guest 端子弹由快照驱动，不做本地推进）
        for (const b of AR.bullets) {
            if (AR.role === 'guest') continue;
            b.life -= dt;
            b.x += b.vx * dt; b.y += b.vy * dt;
            // 撞墙
            if (arBlocked(b.x, b.y, cfg.BULLET_R)) { b.life = 0; AR.fx.push({ x: b.x, y: b.y, type: 'spark', t: 0, life: 0.18 }); continue; }
            if (!b.fromPlayer) {
                // 敌人子弹打玩家（仅房主/单人做权威判定；guest 血量由快照下发）
                if (AR.role === 'host' || AR.role === 'solo') {
                    if (AR.me.alive && arDist(b.x, b.y, AR.me.x, AR.me.y) < cfg.PLAYER_R) {
                        b.life = 0;
                        AR.me.hp = Math.max(0, AR.me.hp - b.dmg);
                        AR.fx.push({ x: AR.me.x, y: AR.me.y, type: 'hit', t: 0, life: 0.2 });
                        if (AR.me.hp <= 0) AR.me.alive = false;
                        continue;
                    }
                    for (const n in AR.peers) {
                        const p = AR.peers[n];
                        if (!p.alive) continue;
                        if (arDist(b.x, b.y, p.x, p.y) < cfg.PLAYER_R) {
                            b.life = 0;
                            p.hp = Math.max(0, p.hp - b.dmg);
                            AR.fx.push({ x: p.x, y: p.y, type: 'hit', t: 0, life: 0.2 });
                            if (p.hp <= 0) { p.alive = false; sendTo(n, { type: 'arena', sub: 'dead' }); }
                            break;
                        }
                    }
                }
            } else {
                // 玩家子弹打敌人（仅房主判定）
                if (AR.role === 'host' || AR.role === 'solo') {
                    for (const e of AR.enemies) {
                        if (e.hp <= 0) continue;
                        if (arDist(b.x, b.y, e.x, e.y) < cfg.ENEMY_R) {
                            b.life = 0; e.hp -= b.dmg;
                            AR.fx.push({ x: e.x, y: e.y, type: 'hit', t: 0, life: 0.2 });
                            if (e.hp <= 0) { AR.score[b.owner] = (AR.score[b.owner] || 0) + 1; }
                            break;
                        }
                    }
                }
            }
        }
        AR.bullets = AR.bullets.filter(b => b.life > 0);
        AR.enemies = AR.enemies.filter(e => e.hp > 0 || AR.role !== 'host');

        // 特效
        for (const f of AR.fx) f.t += dt;
        AR.fx = AR.fx.filter(f => f.t < f.life);

        // 相机跟随
        const vw = AR.W, vh = AR.H;
        AR.camX = arClamp(AR.me.x - vw / 2, 0, Math.max(0, AR.map.W - vw));
        AR.camY = arClamp(AR.me.y - vh / 2, 0, Math.max(0, AR.map.H - vh));

        // 胜负（房主判定）
        if (AR.role === 'host' && !AR.roundOver) {
            const aliveEnemies = AR.enemies.filter(e => e.hp > 0).length;
            if (aliveEnemies === 0) { AR.roundOver = true; AR.roundMsg = '全部敌人已清除！'; arNetRoundEnd(true); }
            else if (!AR.me.alive) { AR.roundOver = true; AR.roundMsg = '你已阵亡'; arNetRoundEnd(false); }
        }
    }

    // ---------- 相机 ----------
    function arScreenToWorld(sx, sy) {
        return { x: sx + AR.camX, y: sy + AR.camY };
    }

    // ---------- 网络：host 广播快照 ----------
    function arBroadcastSnapshot() {
        if (AR.role !== 'host') return;
        const peersSnap = [];
        for (const n in AR.peers) {
            const p = AR.peers[n];
            peersSnap.push({ n: n, x: Math.round(p.x), y: Math.round(p.y), a: +p.angle.toFixed(2), hp: p.hp, alive: p.alive });
        }
        const snap = {
            type: 'arena', sub: 'snap',
            ts: Date.now(),
            me: { x: Math.round(AR.me.x), y: Math.round(AR.me.y), a: +AR.me.angle.toFixed(2), hp: AR.me.hp, alive: AR.me.alive },
            peers: peersSnap,
            enemies: AR.enemies.filter(e => e.hp > 0).map(e => ({ x: Math.round(e.x), y: Math.round(e.y), a: +e.angle.toFixed(2), hp: e.hp })),
            bullets: AR.bullets.map(b => ({ x: Math.round(b.x), y: Math.round(b.y), o: b.owner, fp: b.fromPlayer ? 1 : 0 })),
            score: AR.score,
            over: AR.roundOver, msg: AR.roundMsg,
        };
        broadcast(snap);
    }

    // ---------- 网络：guest 发输入 ----------
    function arSendInput() {
        if (AR.role !== 'guest') return;
        if (!connections.host) return;
        try {
            connections.host.send({
                type: 'arena', sub: 'input',
                x: Math.round(AR.me.x), y: Math.round(AR.me.y),
                a: +AR.me.angle.toFixed(2),
                fire: AR.mouse.down ? 1 : 0,
                keys: { w: !!AR.keys['w'], a: !!AR.keys['a'], s: !!AR.keys['s'], d: !!AR.keys['d'] },
            });
        } catch (e) {}
    }

    // ---------- 游戏循环 ----------
    // 物理与渲染分离：物理走 setInterval（后台窗口不被节流），渲染走 rAF
    function arTickPhysics() {
        if (!AR.active) return;
        const now = performance.now();
        if (!AR.lastPhys) AR.lastPhys = now;
        let dt = (now - AR.lastPhys) / 1000;
        AR.lastPhys = now;
        dt = Math.min(dt, 0.05);
        arUpdateWorld(dt);
        arTickPeerCooldowns(dt);
    }

    function arLoop(ts) {
        if (!AR.active) return;
        arRender();
        AR.raf = requestAnimationFrame(arLoop);
    }

    // ---------- 渲染 ----------
    function arRender() {
        const ctx = AR.ctx, W = AR.W, H = AR.H;
        if (!ctx) return;

        // 背景
        ctx.fillStyle = '#080b10';
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        ctx.translate(-AR.camX, -AR.camY);

        // 地板网格
        const gs = 80;
        ctx.strokeStyle = 'rgba(88,166,255,0.05)';
        ctx.lineWidth = 1;
        const x0 = Math.floor(AR.camX / gs) * gs;
        const y0 = Math.floor(AR.camY / gs) * gs;
        for (let x = x0; x < AR.camX + W + gs; x += gs) {
            ctx.beginPath(); ctx.moveTo(x, AR.camY); ctx.lineTo(x, AR.camY + H); ctx.stroke();
        }
        for (let y = y0; y < AR.camY + H + gs; y += gs) {
            ctx.beginPath(); ctx.moveTo(AR.camX, y); ctx.lineTo(AR.camX + W, y); ctx.stroke();
        }

        // 出生房高亮
        const sr = AR.map.spawnRect;
        ctx.fillStyle = 'rgba(63,185,80,0.05)';
        ctx.fillRect(sr.x, sr.y, sr.w, sr.h);

        // 墙
        ctx.fillStyle = '#2a3441';
        ctx.strokeStyle = '#465363';
        ctx.lineWidth = 1;
        for (const w of AR.map.walls) {
            ctx.fillRect(w.x, w.y, w.w, w.h);
            ctx.strokeRect(w.x + 0.5, w.y + 0.5, w.w - 1, w.h - 1);
        }

        // 门
        for (const d of AR.map.doors) {
            if (d.open) {
                ctx.fillStyle = 'rgba(63,185,80,0.25)';
                ctx.fillRect(d.x, d.y, d.w, d.h);
            } else {
                ctx.fillStyle = d.secure ? '#8b6914' : '#7a4a1e';
                ctx.fillRect(d.x, d.y, d.w, d.h);
                if (d.secure) {
                    ctx.strokeStyle = '#e3b341';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(d.x + 1, d.y + 1, d.w - 2, d.h - 2);
                }
            }
        }

        // 敌人
        for (const e of AR.enemies) {
            if (e.hp <= 0) continue;
            arDrawUnit(ctx, e.x, e.y, e.angle, '#da3633', AR_CFG.ENEMY_R);
            // 血条
            const pct = Math.max(0, e.hp / AR_CFG.ENEMY_HP);
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(e.x - 15, e.y - 24, 30, 4);
            ctx.fillStyle = '#da3633';
            ctx.fillRect(e.x - 15, e.y - 24, 30 * pct, 4);
        }

        // 其他玩家
        for (const n in AR.peers) {
            const p = AR.peers[n];
            if (!p.alive) continue;
            arDrawUnit(ctx, p.x, p.y, p.angle, '#58a6ff', AR_CFG.PLAYER_R);
            ctx.fillStyle = 'rgba(88,166,255,0.9)';
            ctx.font = '11px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(n, p.x, p.y - 22);
        }

        // 本地玩家
        if (AR.me && AR.me.alive) {
            arDrawUnit(ctx, AR.me.x, AR.me.y, AR.me.angle, '#3fb950', AR_CFG.PLAYER_R);
        }

        // 子弹
        for (const b of AR.bullets) {
            ctx.beginPath();
            ctx.fillStyle = b.fromPlayer ? '#f0f6fc' : '#ff7b72';
            ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
            ctx.fill();
            // 拖尾
            ctx.strokeStyle = b.fromPlayer ? 'rgba(240,246,252,0.4)' : 'rgba(255,123,114,0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(b.x, b.y);
            ctx.lineTo(b.x - b.vx * 0.02, b.y - b.vy * 0.02);
            ctx.stroke();
        }

        // 特效
        for (const f of AR.fx) {
            const k = f.t / f.life;
            const r = f.type === 'spark' ? 3 + k * 8 : 8 + k * 12;
            ctx.beginPath();
            ctx.strokeStyle = f.type === 'hit' ? 'rgba(255,123,114,' + (1 - k) + ')' : 'rgba(240,246,252,' + (1 - k) + ')';
            ctx.lineWidth = 2;
            ctx.arc(f.x, f.y, r, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.restore();

        // 暗角
        const grad = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.75)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // 准星
        ctx.strokeStyle = 'rgba(240,246,252,0.7)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(AR.mouse.x, AR.mouse.y, 9, 0, Math.PI * 2);
        ctx.moveTo(AR.mouse.x - 14, AR.mouse.y); ctx.lineTo(AR.mouse.x - 5, AR.mouse.y);
        ctx.moveTo(AR.mouse.x + 5, AR.mouse.y); ctx.lineTo(AR.mouse.x + 14, AR.mouse.y);
        ctx.moveTo(AR.mouse.x, AR.mouse.y - 14); ctx.lineTo(AR.mouse.x, AR.mouse.y - 5);
        ctx.moveTo(AR.mouse.x, AR.mouse.y + 5); ctx.lineTo(AR.mouse.x, AR.mouse.y + 14);
        ctx.stroke();

        // HUD
        arRenderHUD(ctx, W, H);
    }

    function arDrawUnit(ctx, x, y, ang, color, r) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(ang);
        // 身体
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.5)';
        ctx.lineWidth = 2;
        ctx.stroke();
        // 枪管
        ctx.beginPath();
        ctx.fillStyle = '#c9d1d9';
        ctx.fillRect(r - 2, -2.5, 12, 5);
        ctx.restore();
    }

    function arRenderHUD(ctx, W, H) {
        // 血条
        if (AR.me) {
            const pct = Math.max(0, AR.me.hp / AR_CFG.PLAYER_HP);
            const bw = 200, bh = 12, bx = 20, by = H - 40;
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
            ctx.fillStyle = pct > 0.5 ? '#3fb950' : pct > 0.25 ? '#d29922' : '#da3633';
            ctx.fillRect(bx, by, bw * pct, bh);
            ctx.strokeStyle = 'rgba(240,246,252,0.3)';
            ctx.lineWidth = 1;
            ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
            ctx.fillStyle = '#f0f6fc';
            ctx.font = '11px monospace';
            ctx.textAlign = 'left';
            ctx.fillText('HP ' + Math.ceil(AR.me.hp) + ' / ' + AR_CFG.PLAYER_HP, bx, by - 7);
        }

        // 剩余敌人
        const alive = AR.enemies.filter(e => e.hp > 0).length;
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(W - 150, 14, 136, 34);
        ctx.strokeStyle = 'rgba(218,54,51,0.5)';
        ctx.lineWidth = 1;
        ctx.strokeRect(W - 150 + 0.5, 14.5, 135, 33);
        ctx.fillStyle = '#da3633';
        ctx.font = 'bold 13px monospace';
        ctx.textAlign = 'left';
        ctx.fillText('敌人剩余', W - 140, 30);
        ctx.fillStyle = '#f0f6fc';
        ctx.font = 'bold 16px monospace';
        ctx.fillText(String(alive), W - 140, 44);

        // 击杀分
        const myScore = AR.score['me'] || 0;
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(W - 150, 54, 136, 30);
        ctx.strokeStyle = 'rgba(63,185,80,0.5)';
        ctx.strokeRect(W - 150 + 0.5, 54.5, 135, 29);
        ctx.fillStyle = '#3fb950';
        ctx.font = 'bold 13px monospace';
        ctx.fillText('击杀 ' + myScore, W - 140, 74);

        // 结算
        if (AR.roundOver) {
            ctx.fillStyle = 'rgba(1,4,9,0.82)';
            ctx.fillRect(0, 0, W, H);
            ctx.textAlign = 'center';
            ctx.fillStyle = '#f0f6fc';
            ctx.font = 'bold 34px sans-serif';
            ctx.fillText(AR.roundMsg || '结束', W / 2, H / 2 - 10);
            ctx.font = '14px monospace';
            ctx.fillStyle = '#8b949e';
            ctx.fillText('按 Esc 退出', W / 2, H / 2 + 30);
        }

        // 阵亡遮罩
        if (AR.me && !AR.me.alive && !AR.roundOver) {
            ctx.fillStyle = 'rgba(218,54,51,0.18)';
            ctx.fillRect(0, 0, W, H);
            ctx.textAlign = 'center';
            ctx.fillStyle = '#da3633';
            ctx.font = 'bold 28px sans-serif';
            ctx.fillText('已阵亡', W / 2, H / 2);
        }
    }

    // ---------- 网络消息 ----------
    function arOnNet(conn, d) {
        const name = (conn.metadata && conn.metadata.name) || '访客';
        if (d.sub === 'open') {
            // 房主发起 → 成员进入，并使用房主传来的地图
            addSys(name + ' 发起了联机枪战');
            arEnter('guest');
            if (d.map) {
                AR.map = {
                    cols: d.map.cols, rows: d.map.rows, cw: d.map.cw, ch: d.map.ch,
                    W: d.map.W, H: d.map.H,
                    walls: d.map.walls.map(w => ({ ...w })),
                    doors: d.map.doors.map(x => ({ ...x })),
                    spawnRect: { ...d.map.spawnRect },
                    enemySpawns: (d.map.enemySpawns || []).map(s => ({ ...s }))
                };
                // 出生点对齐房主
                const sr = AR.map.spawnRect;
                AR.me.x = sr.x + sr.w / 2;
                AR.me.y = sr.y + sr.h / 2;
            }
        } else if (d.sub === 'snap') {
            // guest 收到世界快照
            if (AR.role !== 'guest') return;
            if (!AR.active) arEnter('guest');
            // 应用快照
            AR.enemies = (d.enemies || []).map(e => ({
                x: e.x, y: e.y, angle: e.a, hp: e.hp,
                state: 0, timer: 0, target: null, fireCd: 0, patrol: null
            }));
            AR.bullets = (d.bullets || []).map(b => ({
                x: b.x, y: b.y, vx: 0, vy: 0,
                owner: b.o, fromPlayer: b.fp === 1, life: 999, dmg: 0
            }));
            // 房主位置作为 peer
            AR.peers = {};
            if (d.me) AR.peers['房主'] = { x: d.me.x, y: d.me.y, angle: d.me.a, hp: d.me.hp, maxHp: 100, alive: d.me.alive };
            // 其他成员
            if (d.peers) {
                for (const q of d.peers) {
                    if (!q || q.n === myName) continue;
                    AR.peers[q.n] = { x: q.x, y: q.y, angle: q.a, hp: q.hp, maxHp: 100, alive: q.alive };
                }
                // 自己的血量由房主权威下发
                for (const q of d.peers) {
                    if (q && q.n === myName) {
                        AR.me.hp = q.hp;
                        if (!q.alive) AR.me.alive = false;
                        break;
                    }
                }
            }
            AR.score = d.score || {};
            if (d.over && !AR.roundOver) { AR.roundOver = true; AR.roundMsg = d.msg || '结束'; }
        } else if (d.sub === 'input') {
            // 房主收到成员输入
            if (AR.role !== 'host') return;
            AR.peers[name] = AR.peers[name] || { x: d.x, y: d.y, angle: d.a, hp: 100, maxHp: 100, alive: true };
            const p = AR.peers[name];
            p.x = d.x; p.y = d.y; p.angle = d.a;
            if (d.fire && (!p._fireCd || p._fireCd <= 0)) {
                p._fireCd = AR_CFG.FIRE_CD;
                arFire(p, name, true);
            }
        } else if (d.sub === 'closed') {
            addSys(name + ' 退出了枪战');
            if (AR.role === 'guest' && AR.active) { arLeave(false); }
        } else if (d.sub === 'dead') {
            if (AR.peers[name]) AR.peers[name].alive = false;
        }
    }

    // 房主每帧为 peer 递减冷却
    function arTickPeerCooldowns(dt) {
        for (const n in AR.peers) {
            const p = AR.peers[n];
            if (p._fireCd > 0) p._fireCd = Math.max(0, p._fireCd - dt);
        }
    }

    // ---------- 生命周期 ----------
    function arEnter(role) {
        AR.active = true;
        AR.role = role;
        AR.roundOver = false;
        AR.roundMsg = '';
        AR.score = {};
        AR.peers = {};
        AR.bullets = [];
        AR.fx = [];
        AR.lastTs = 0;
        AR.netTick = 0;
        AR.inputTick = 0;

        // 显示覆盖层
        const ov = document.getElementById('arena-overlay');
        ov.classList.remove('hidden');
        ov.classList.add('flex');
        arStatus(role === 'host' ? '房主' : '成员');

        // 初始化 Canvas
        const cv = document.getElementById('arena-canvas');
        AR.canvas = cv;
        const dpr = window.devicePixelRatio || 1;
        AR.DPR = dpr;
        const rect = cv.parentElement.getBoundingClientRect();
        AR.W = rect.width;
        AR.H = rect.height;
        cv.width = Math.floor(AR.W * dpr);
        cv.height = Math.floor(AR.H * dpr);
        cv.style.width = AR.W + 'px';
        cv.style.height = AR.H + 'px';
        const ctx = cv.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        AR.ctx = ctx;

        // 生成地图
        if (role === 'host') {
            AR.map = arBuildMap(3, 3);
            // 本地玩家在出生房中央
            const sr = AR.map.spawnRect;
            AR.me = { x: sr.x + sr.w / 2, y: sr.y + sr.h / 2, angle: 0, hp: AR_CFG.PLAYER_HP, maxHp: AR_CFG.PLAYER_HP, fireCd: 0, alive: true };
            // 生成敌人（关卡 1：5 个）
            AR.enemies = [];
            const spawns = AR.map.enemySpawns.slice();
            for (let i = 0; i < 5 && i < spawns.length; i++) {
                const sp = spawns[i % spawns.length];
                AR.enemies.push({
                    x: sp.x + arRnd(-40, 40), y: sp.y + arRnd(-40, 40),
                    angle: arRnd(-Math.PI, Math.PI), hp: AR_CFG.ENEMY_HP,
                    state: 0, timer: 0, target: null, fireCd: 0, patrol: null
                });
            }
        } else {
            // guest：等快照填充地图（先建个空占位避免报错）
            AR.map = arBuildMap(3, 3);
            const sr = AR.map.spawnRect;
            AR.me = { x: sr.x + sr.w / 2, y: sr.y + sr.h / 2, angle: 0, hp: AR_CFG.PLAYER_HP, maxHp: AR_CFG.PLAYER_HP, fireCd: 0, alive: true };
            AR.enemies = [];
        }

        arBindInput();
        AR.lastPhys = 0;
        AR.raf = requestAnimationFrame(arLoop);
        AR.roundStart = Date.now();
        // 物理 60Hz + 网络同步 20Hz，均走独立定时器（后台窗口 rAF 会被节流）
        if (AR.physTimer) clearInterval(AR.physTimer);
        AR.physTimer = setInterval(arTickPhysics, 1000 / 60);
        if (AR.netTimer) clearInterval(AR.netTimer);
        AR.netTimer = setInterval(() => {
            if (!AR.active) return;
            arBroadcastSnapshot();
            arSendInput();
        }, 1000 / AR_CFG.NET_HZ);
    }

    function arLeave(notify) {
        AR.active = false;
        AR.role = null;
        if (AR.raf) { cancelAnimationFrame(AR.raf); AR.raf = null; }
        if (AR.physTimer) { clearInterval(AR.physTimer); AR.physTimer = null; }
        if (AR.netTimer) { clearInterval(AR.netTimer); AR.netTimer = null; }
        AR.lastPhys = 0;
        arUnbindInput();
        const ov = document.getElementById('arena-overlay');
        ov.classList.add('hidden');
        ov.classList.remove('flex');
        if (notify !== false) {
            if (isHost) broadcast({ type: 'arena', sub: 'closed' });
            else if (connections.host) { try { connections.host.send({ type: 'arena', sub: 'closed' }); } catch (e) {} }
        }
    }

    function arStart() {
        if (AR.active) return;
        if (!isHost) { addSys('只有房主可以发起枪战'); return; }
        addSys('你发起了联机枪战，等待成员加入');
        arEnter('host');
        // 广播地图，guest 使用同一张地图（否则各自随机生成会穿墙/卡墙）
        broadcast({ type: 'arena', sub: 'open', map: {
            cols: AR.map.cols, rows: AR.map.rows, cw: AR.map.cw, ch: AR.map.ch,
            W: AR.map.W, H: AR.map.H,
            walls: AR.map.walls, doors: AR.map.doors,
            spawnRect: AR.map.spawnRect, enemySpawns: AR.map.enemySpawns
        } });
    }

    function arStatus(t) {
        const el = document.getElementById('arena-status');
        if (el) el.textContent = t ? '· ' + t : '';
    }

    // ---------- 输入绑定 ----------
    function arBindInput() {
        if (AR._bound) return;
        AR._bound = true;
        AR._kd = (e) => {
            const k = e.key.toLowerCase();
            if (k === 'escape') { arLeave(); return; }
            AR.keys[k] = true;
            if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
        };
        AR._ku = (e) => { AR.keys[e.key.toLowerCase()] = false; };
        AR._mm = (e) => {
            const r = AR.canvas.getBoundingClientRect();
            AR.mouse.x = e.clientX - r.left;
            AR.mouse.y = e.clientY - r.top;
        };
        AR._md = (e) => { if (e.button === 0) AR.mouse.down = true; };
        AR._mu = (e) => { if (e.button === 0) AR.mouse.down = false; };
        window.addEventListener('keydown', AR._kd);
        window.addEventListener('keyup', AR._ku);
        AR.canvas.addEventListener('mousemove', AR._mm);
        AR.canvas.addEventListener('mousedown', AR._md);
        window.addEventListener('mouseup', AR._mu);
        AR.canvas.addEventListener('contextmenu', e => e.preventDefault());
    }
    function arUnbindInput() {
        if (!AR._bound) return;
        AR._bound = false;
        window.removeEventListener('keydown', AR._kd);
        window.removeEventListener('keyup', AR._ku);
        if (AR.canvas) {
            AR.canvas.removeEventListener('mousemove', AR._mm);
            AR.canvas.removeEventListener('mousedown', AR._md);
        }
        window.removeEventListener('mouseup', AR._mu);
        AR.keys = {}; AR.mouse.down = false;
    }

    // 窗口 resize
    window.addEventListener('resize', () => {
        if (!AR.active || !AR.canvas) return;
        const dpr = window.devicePixelRatio || 1;
        const rect = AR.canvas.parentElement.getBoundingClientRect();
        AR.W = rect.width; AR.H = rect.height;
        AR.canvas.width = Math.floor(AR.W * dpr);
        AR.canvas.height = Math.floor(AR.H * dpr);
        AR.canvas.style.width = AR.W + 'px';
        AR.canvas.style.height = AR.H + 'px';
        AR.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    });

    // 事件绑定 & 初始化
    // ============================================================
    $('create-btn').addEventListener('click', createRoom);
    $('refresh-btn').addEventListener('click', loadRooms);
    $('leave-btn').addEventListener('click', leaveRoom);
    $('send-btn').addEventListener('click', sendMsg);
    $('msg-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });
    $('game-btn').addEventListener('click', () => { if (isHost) hostStartGame(); else addSys('只有房主可以发起游戏'); });
    $('arena-btn').addEventListener('click', arStart);
    $('arena-close').addEventListener('click', () => arLeave());

    $('nickname').value = localStorage.getItem('lobby_nick') || '';

    loadRooms();
    setInterval(loadRooms, 10000); // 大厅每 10s 自动刷新

    // 关闭页面前清理（房主）：sendBeacon 尽力通知 Worker 注销房间
    window.addEventListener('beforeunload', () => {
        if (isHost && roomId) {
            try {
                navigator.sendBeacon(API_BASE + '/leave', new Blob([JSON.stringify({ code: roomId })], { type: 'application/json' }));
            } catch (e) {}
        }
    });
    </script>
</body>
</html>
