        tailwind.config = {

</head>

                        <button id="send-btn" class="px-5 py-2.5 bg-glow-blue/20 text-glow-blue border border-glow-blue/40 rounded-lg text-sm font-medium hover:bg-glow-blue/30 transition">发送</button>
                    </div>
                    <div id="game-overlay" class="hidden"></div>

        </div>
    </main>

    <footer class="relative z-10 border-t border-white/5 py-6 text-center text-xs text-space-muted">
        <p>&copy; 2026 lunarHope. 联机基于 WebRTC 点对点直连。</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
    // ============================================================
    // 配置
    // ============================================================
    const API_BASE = 'https://roomfind.us.ci';  // Cloudflare Worker（房间登记）
    const HEARTBEAT_MS = 20000;   // 心跳间隔
    const STALE_MS = 60000;       // 超过 60s 无心跳视为过期

    // ============================================================
    // 状态
    // ============================================================
    let peer = null;
    let isHost = false;
    let myCode = '';
    let myName = '';
    let roomName = '';
    let connections = {};   // host: connId -> conn ; client: { host: conn }
    let heartbeatTimer = null;
    let roomId = null;      // 房主：是否已登记房间（用于删除/心跳）

    const $ = id => document.getElementById(id);

    // ============================================================
    // 工具
    // ============================================================
    function genCode(len = 5) {
        const a = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
        let s = '';
        for (let i = 0; i < len; i++) s += a[Math.floor(Math.random() * a.length)];
        return s;
    }
    function esc(s) {
        return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function nowTs() { return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }); }
    function setStatus(text) { $('lobby-status').textContent = text || ''; }
    function setRoomStatus(text) { $('room-status').textContent = text || ''; }

    // ============================================================
    // 房间列表（Cloudflare Worker）
    // ============================================================
    async function loadRooms() {
        try {
            const res = await fetch(API_BASE + '/rooms');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            renderRooms(Array.isArray(data) ? data : []);
        } catch (e) {
            $('room-list').innerHTML = `<p class="text-glow-pink text-sm text-center py-10">加载房间失败：${esc(e.message)}</p>`;
        }
    }

    function renderRooms(rooms) {
        $('room-count').textContent = rooms.length + ' 个';
        if (!rooms.length) {
            $('room-list').innerHTML = '<p class="text-space-muted text-sm text-center py-10">暂时没有房间，创建一个吧 👆</p>';
            return;
        }
        $('room-list').innerHTML = rooms.map(r => `
            <div class="spotlight-card rounded-xl p-4 flex items-center justify-between gap-4">
                <div class="min-w-0">
                    <h3 class="font-semibold text-space-text truncate">${esc(r.name)}</h3>
                    <p class="text-xs text-space-muted font-mono mt-1">
                        房主 ${esc(r.host)} · 房间码 <span class="text-glow-green">${esc(r.code)}</span>
                    </p>
                </div>
                <button data-join="${esc(r.code)}" data-name="${esc(r.name)}"
                    class="join-btn px-4 py-2 bg-glow-green/10 text-glow-green border border-glow-green/40 rounded-lg text-sm hover:bg-glow-green/20 transition whitespace-nowrap">
                    加入
                </button>
            </div>
        `).join('');
        document.querySelectorAll('.join-btn').forEach(btn => {
            btn.addEventListener('click', () => joinRoom(btn.dataset.join, btn.dataset.name));
        });
    }

    // ============================================================
    // 创建房间（房主）
    // ============================================================
    async function createRoom() {
        myName = ($('nickname').value || '').trim() || '房主';
        roomName = ($('room-name').value || '').trim() || (myName + ' 的房间');
        localStorage.setItem('lobby_nick', myName);

        setStatus('正在创建房间...');
        myCode = genCode();
        isHost = true;

        // 1. 登记房间到 Worker
        try {
            const res = await fetch(API_BASE + '/announce', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: myCode, name: roomName, host: myName })
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            roomId = myCode;
        } catch (e) {
            setStatus('创建失败：' + e.message);
            return;
        }

        // 2. 建立 PeerJS（房主 id = 房间码）
        try {
            peer = new Peer(myCode, { debug: 1 });
            await new Promise((res, rej) => {
                peer.on('open', res);
                peer.on('error', e => rej(new Error(e.type || 'peer error')));
                setTimeout(() => rej(new Error('信令超时（PeerJS 云端可能不可达，请稍后重试）')), 15000);
            });
        } catch (e) {
            await cleanupRoom();
            setStatus('创建失败：' + e.message);
            return;
        }

        // 3. 监听连接
        peer.on('connection', conn => {
            connections[conn.peer] = conn;
            conn.on('data', d => onHostData(conn, d));
            conn.on('close', () => {
                delete connections[conn.peer];
                addSys(`${conn.metadata?.name || '有人'} 离开了`);
                broadcastMembers();
            });
        });

        // 4. 心跳
        heartbeatTimer = setInterval(() => {
            if (!roomId) return;
            fetch(API_BASE + '/heartbeat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: roomId })
            }).catch(() => {});
        }, HEARTBEAT_MS);

        // 5. 进入房间视图
        enterRoomView('房主');
        addSys('房间已创建，把房间码告诉朋友吧');
    }

    // ============================================================
    // 加入房间（客户端）
    // ============================================================
    async function joinRoom(code, name) {
        myName = ($('nickname').value || '').trim() || '访客';
        localStorage.setItem('lobby_nick', myName);
        myCode = code; roomName = name; isHost = false;

        setStatus('正在连接房间 ' + code + ' ...');
        try {
            peer = new Peer({ debug: 1 });
            await new Promise((res, rej) => {
                peer.on('open', res);
                peer.on('error', e => rej(new Error(e.type || 'peer error')));
                setTimeout(() => rej(new Error('信令超时')), 15000);
            });
        } catch (e) {
            setStatus('连接失败：' + e.message);
            return;
        }

        const conn = peer.connect(code, { metadata: { name: myName } });
        conn.on('open', () => {
            connections.host = conn;
            setStatus('已连接，等待房主确认...');
            conn.send({ type: 'join', name: myName });
        });
        conn.on('data', d => onClientData(d));
        conn.on('close', () => { addSys('与房主的连接已断开'); setRoomStatus('连接已断开'); });
        conn.on('error', e => { addSys('连接错误：' + (e.type || e)); });
    }

    // ============================================================
    // 消息处理
    // ============================================================
    // 房主收到客户端消息
    function onHostData(conn, d) {
        if (!d || typeof d !== 'object') return;
        if (d.type === 'join') {
            const name = (d.name || '').trim() || '访客';
            // 收集房间内已有的昵称（含房主）
            const existing = [myName];
            for (const id in connections) {
                if (connections[id] === conn) continue;
                existing.push((connections[id].metadata && connections[id].metadata.name) || '访客');
            }
            if (existing.includes(name)) {
                try { conn.send({ type: 'reject', reason: '昵称「' + name + '」已被占用，请换一个' }); } catch (e) {}
                setTimeout(() => { try { conn.close(); } catch (e) {} }, 300);
                return;
            }
            conn.metadata = conn.metadata || {};
            conn.metadata.name = name;
            try { conn.send({ type: 'welcome' }); } catch (e) {}
            addSys(`${name} 加入了`);
            broadcastMembers();
        } else if (d.type === 'msg') {
            const from = (conn.metadata && conn.metadata.name) || '访客';
            addMsg(from, d.text, false);
            broadcast({ type: 'msg', from, text: d.text }, conn); // 转发给其他人
        } else if (d.type === 'game' && d.sub === 'action') {
            hostGameAction(conn, d);
        }
    }
    // 客户端收到房主消息
    function onClientData(d) {
        if (!d || typeof d !== 'object') return;
        if (d.type === 'welcome') {
            enterRoomView('成员');
            addSys('已加入房间');
        }
        else if (d.type === 'msg') addMsg(d.from, d.text, false);
        else if (d.type === 'sys') addSys(d.text);
        else if (d.type === 'members') setRoomStatus('在线：' + d.list.join('、'));
        else if (d.type === 'game') clientGameData(d);
        else if (d.type === 'reject') {
            setStatus('加入失败：' + (d.reason || '昵称重复'));
            if (peer) { try { peer.destroy(); } catch (e) {} }
            peer = null; connections = {}; myCode = ''; roomName = '';
        }
    }

    function broadcast(obj, exceptConn) {
        for (const id in connections) {
            if (connections[id] === exceptConn) continue;
            try { connections[id].send(obj); } catch (e) {}
        }
    }
    function broadcastMembers() {
        const names = [myName];
        for (const id in connections) {
            const n = (connections[id].metadata && connections[id].metadata.name) || '访客';
            if (!names.includes(n)) names.push(n);
        }
        broadcast({ type: 'members', list: names });
        setRoomStatus('在线：' + names.join('、'));
    }

    function sendMsg() {
        const text = ($('msg-input').value || '').trim();
        if (!text) return;
        $('msg-input').value = '';
        addMsg(myName, text, true);
        if (isHost) broadcast({ type: 'msg', from: myName, text });
        else if (connections.host) connections.host.send({ type: 'msg', text });
    }

    // ============================================================
    // UI 渲染
    // ============================================================
    function addMsg(from, text, self) {
        const box = $('chat-box');
        const el = document.createElement('div');
        el.className = 'flex flex-col ' + (self ? 'items-end' : 'items-start');
        el.innerHTML = `
            <div class="text-[11px] text-space-muted mb-1 font-mono">${esc(from)} · ${nowTs()}</div>
            <div class="max-w-[75%] rounded-lg px-3.5 py-2 text-sm break-words ${self ? 'bg-glow-purple/20 border border-glow-purple/40' : 'bg-space-800 border border-space-border'}">${esc(text)}</div>
        `;
        box.appendChild(el);
        box.scrollTop = box.scrollHeight;
    }
    function addSys(text) {
        const box = $('chat-box');
        const el = document.createElement('div');
        el.className = 'text-center text-xs text-space-muted font-mono py-1';
        el.textContent = '— ' + text + ' —';
        box.appendChild(el);
        box.scrollTop = box.scrollHeight;
    }

    function enterRoomView(role) {
        $('lobby-view').classList.add('hidden');
        $('room-view').classList.remove('hidden');
        $('rv-name').textContent = roomName;
        $('rv-code').textContent = myCode;
        $('rv-role').textContent = '（' + role + '）';
        setStatus('');
    }

    async function leaveRoom() {
        // 房主：注销房间
        if (isHost && roomId) { try { await fetch(API_BASE + '/leave', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: roomId }) }); } catch (e) {} }
        if (heartbeatTimer) clearInterval(heartbeatTimer);
        if (peer) { try { peer.destroy(); } catch (e) {} }
        peer = null; connections = {}; roomId = null; heartbeatTimer = null;
        $('room-view').classList.add('hidden');
        $('lobby-view').classList.remove('hidden');
        $('chat-box').innerHTML = '';
        gameOverlayHide();
        GAME.active = false; if (GAME.timer) clearTimeout(GAME.timer);
        setRoomStatus('');
        loadRooms();
    }

    async function cleanupRoom() {
        if (heartbeatTimer) clearInterval(heartbeatTimer);
        if (roomId) { try { await fetch(API_BASE + '/leave', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: roomId }) }); } catch (e) {} }
        if (peer) { try { peer.destroy(); } catch (e) {} }
    }

    // ============================================================
    // 小游戏系统（房主权威：房主计算，客户端发动作）
    // 一局 = 3 轮，每轮从游戏池随机抽一个，胜者 +1 分
    // ============================================================
    const GAME = {
        active: false,
        totalRounds: 5,
        roundIndex: 0,
        scores: {},          // name -> score
        curGame: null,       // 'reaction' | 'rps' | 'math' | 'draw' | 'bomb'
        curData: null,
        pool: ['reaction', 'rps', 'math', 'draw', 'bomb'],
        timer: null,
        myAnswer: null,
        roundStart: 0,
        collected: {},       // 房主收集：name -> value
        roundResolved: false,
        drawer: null,        // 你画我猜：画手名
        word: null,          // 你画我猜：答案词
    };

    // 你画我猜词库
    const DRAW_WORDS = ['太阳','月亮','苹果','汽车','房子','小猫','大树','飞机','雨伞','蛋糕','眼镜','足球','熊猫','火箭','冰淇淋','钥匙','气球','蜡烛','雪人','星星','香蕉','雨衣','台灯','钟表','乌龟','蝴蝶','书包','桥'];

    // 玩家名列表 / 定向发送
    function allPlayerNames() {
        const names = [myName];
        for (const id in connections) names.push((connections[id].metadata && connections[id].metadata.name) || '访客');
        return names;
    }
    function connByName(name) {
        for (const id in connections) {
            if (((connections[id].metadata && connections[id].metadata.name) || '访客') === name) return connections[id];
        }
        return null;
    }
    function sendTo(name, obj) {
        if (name === myName) return; // 房主自己直接渲染
        const c = connByName(name);
        if (c) { try { c.send(obj); } catch (e) {} }
    }

    function gEsc(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

    function gameSend(obj) {
        // 房主广播；客户端发给房主
        if (isHost) broadcast(obj);
        else if (connections.host) connections.host.send(obj);
    }

    // ---------- 房主：开始 / 轮次 / 结束 ----------
    function hostStartGame() {
        if (!isHost) return;
        const players = [myName];
        for (const id in connections) players.push((connections[id].metadata && connections[id].metadata.name) || '访客');
        GAME.active = true;
        GAME.roundIndex = 0;
        GAME.scores = {};
        players.forEach(p => GAME.scores[p] = 0);
        GAME.curGame = null;
        broadcast({ type: 'game', sub: 'start', total: GAME.totalRounds, scores: { ...GAME.scores } });
        renderGameStart(GAME.totalRounds);
    }

    function hostNextRound() {
        if (!GAME.active) return;
        GAME.roundIndex++;
        if (GAME.roundIndex > GAME.totalRounds) { hostEndGame(); return; }
        const others = GAME.pool.filter(g => g !== GAME.curGame);
        GAME.curGame = others[Math.floor(Math.random() * others.length)];
        GAME.curData = null;
        GAME.collected = {};
        GAME.roundResolved = false;
        GAME.myAnswer = null;
        broadcast({ type: 'game', sub: 'round', game: GAME.curGame, round: GAME.roundIndex, total: GAME.totalRounds, scores: { ...GAME.scores } });
        if (GAME.curGame === 'reaction') hostReaction();
        else if (GAME.curGame === 'rps') hostRps();
        else if (GAME.curGame === 'math') hostMath();
        else if (GAME.curGame === 'draw') hostDraw();
        else if (GAME.curGame === 'bomb') hostBomb();
    }

    function hostEndGame() {
        GAME.active = false;
        broadcast({ type: 'game', sub: 'over', scores: { ...GAME.scores } });
        renderGameOver(GAME.scores);
    }

    // ---------- 游戏 1：反应速度 ----------
    function hostReaction() {
        renderGameReaction('prepare');
        const delay = 2000 + Math.random() * 3000;
        GAME.timer = setTimeout(() => {
            GAME.roundStart = Date.now();
            GAME.collected = {};
            broadcast({ type: 'game', sub: 'phase', phase: 'go', ts: GAME.roundStart });
            renderGameReaction('go');
            // 3 秒后结算
            GAME.timer = setTimeout(() => hostResolveReaction(), 3000);
        }, delay);
    }
    function hostResolveReaction() {
        if (GAME.roundResolved) return;
        GAME.roundResolved = true;
        // 房主自己也参与
        let best = null, bestT = Infinity;
        for (const name in GAME.collected) {
            const t = GAME.collected[name];
            if (t < bestT) { bestT = t; best = name; }
        }
        let msg;
        if (best) { GAME.scores[best] = (GAME.scores[best] || 0) + 1; msg = best + ' 最快（' + bestT + 'ms）'; }
        else msg = '无人响应';
        broadcast({ type: 'game', sub: 'phase', phase: 'result', text: msg, scores: { ...GAME.scores } });
        renderGameResult(msg, GAME.scores);
    }

    // ---------- 游戏 2：石头剪刀布 ----------
    function hostRps() {
        const hands = ['rock', 'paper', 'scissors'];
        GAME.curData = { hostHand: hands[Math.floor(Math.random() * 3)] };
        GAME.collected = {};
        broadcast({ type: 'game', sub: 'phase', phase: 'choose' });
        renderGameRps('choose');
        GAME.timer = setTimeout(() => hostResolveRps(), 8000); // 8 秒兜底
    }
    function hostResolveRps() {
        if (GAME.roundResolved) return;
        GAME.roundResolved = true;
        clearTimeout(GAME.timer);
        const hostHand = GAME.curData.hostHand;
        const beats = { rock: 'scissors', paper: 'rock', scissors: 'paper' };
        const winners = [];
        for (const name in GAME.collected) {
            const h = GAME.collected[name];
            if (beats[h] === hostHand) winners.push(name);
        }
        winners.forEach(w => GAME.scores[w] = (GAME.scores[w] || 0) + 1);
        const handName = { rock: '石头', paper: '布', scissors: '剪刀' }[hostHand];
        const msg = '房主出了「' + handName + '」，' + (winners.length ? winners.join('、') + ' 获胜' : '无人获胜');
        broadcast({ type: 'game', sub: 'phase', phase: 'result', text: msg, scores: { ...GAME.scores } });
        renderGameResult(msg, GAME.scores);
    }

    // ---------- 游戏 3：速算抢答 ----------
    function hostMath() {
        const ops = ['+', '-', '×'];
        const op = ops[Math.floor(Math.random() * 3)];
        let a, b, ans;
        if (op === '+') { a = 10 + Math.floor(Math.random() * 90); b = 10 + Math.floor(Math.random() * 90); ans = a + b; }
        else if (op === '-') { a = 30 + Math.floor(Math.random() * 70); b = 10 + Math.floor(Math.random() * 30); ans = a - b; }
        else { a = 3 + Math.floor(Math.random() * 9); b = 3 + Math.floor(Math.random() * 9); ans = a * b; }
        GAME.curData = { expr: a + ' ' + op + ' ' + b, ans: ans };
        GAME.collected = {};
        broadcast({ type: 'game', sub: 'phase', phase: 'question', expr: GAME.curData.expr });
        renderGameMath('question', GAME.curData.expr);
        GAME.timer = setTimeout(() => hostResolveMath(), 10000); // 10 秒兜底
    }
    function hostResolveMath() {
        if (GAME.roundResolved) return;
        GAME.roundResolved = true;
        clearTimeout(GAME.timer);
        // 找第一个答对的
        let winner = null, bestT = Infinity;
        for (const name in GAME.collected) {
            const c = GAME.collected[name];
            if (c.value === GAME.curData.ans && c.t < bestT) { bestT = c.t; winner = name; }
        }
        let msg;
        if (winner) { GAME.scores[winner] = (GAME.scores[winner] || 0) + 1; msg = winner + ' 答对：' + GAME.curData.ans; }
        else msg = '无人答对，答案是 ' + GAME.curData.ans;
        broadcast({ type: 'game', sub: 'phase', phase: 'result', text: msg, scores: { ...GAME.scores } });
        renderGameResult(msg, GAME.scores);
    }


    // ---------- 游戏 4：你画我猜 ----------
    function hostDraw() {
        // 随机选画手，随机选词
        const players = allPlayerNames();
        GAME.drawer = players[Math.floor(Math.random() * players.length)];
        GAME.word = DRAW_WORDS[Math.floor(Math.random() * DRAW_WORDS.length)];
        GAME.collected = {};
        GAME.curData = { strokes: [] };
        // 广播：所有人进入画板；画手收到词；猜的人不收到词
        broadcast({ type: 'game', sub: 'phase', phase: 'draw-start', drawer: GAME.drawer });
        // 画手（可能是自己或他人）单独告知词
        if (GAME.drawer === myName) {
            renderGameDraw('drawer', GAME.word);
        } else {
            sendTo(GAME.drawer, { type: 'game', sub: 'phase', phase: 'you-draw', word: GAME.word });
            // 房主自己（非画手）也要渲染猜词界面
            renderGameDraw('guesser', null);
        }
        GAME.timer = setTimeout(() => hostResolveDraw(), 45000); // 45 秒
    }
    function hostResolveDraw() {
        if (GAME.roundResolved) return;
        GAME.roundResolved = true;
        clearTimeout(GAME.timer);
        let msg;
        if (GAME.collected.__winner__) {
            const w = GAME.collected.__winner__;
            GAME.scores[w] = (GAME.scores[w] || 0) + 1;
            GAME.scores[GAME.drawer] = (GAME.scores[GAME.drawer] || 0) + 1; // 画手也得分
            msg = w + ' 猜对了「' + GAME.word + '」，' + GAME.drawer + ' 同得 1 分';
        } else {
            msg = '无人猜对，答案是「' + GAME.word + '」';
        }
        broadcast({ type: 'game', sub: 'phase', phase: 'result', text: msg, scores: { ...GAME.scores } });
        renderGameResult(msg, GAME.scores);
    }

    // ---------- 游戏 5：数字炸弹 ----------
    function hostBomb() {
        const answer = 1 + Math.floor(Math.random() * 100); // 1..100
        GAME.curData = { answer: answer, lo: 1, hi: 100, turn: myName };
        GAME.collected = {};
        const players = allPlayerNames();
        GAME.curData.order = players;
        GAME.curData.turnIdx = 0;
        GAME.curData.turn = players[0];
        broadcast({ type: 'game', sub: 'phase', phase: 'bomb-turn', round: GAME.roundIndex, total: GAME.totalRounds, lo: 1, hi: 100, turn: GAME.curData.turn });
        renderGameBomb('turn', 1, 100, GAME.curData.turn);
        // 不做超时兜底——等玩家必然出错才能结算（若卡住，房主可关闭游戏层重开）
    }
    function hostBombGuess(conn, name, value) {
        if (GAME.curGame !== 'bomb' || GAME.roundResolved) return;
        if (name !== GAME.curData.turn) return; // 不是你的回合
        const ans = GAME.curData.answer;
        if (value === ans) {
            // 踩雷，出局，其他人各得 1 分
            GAME.roundResolved = true;
            const msg = name + ' 踩到炸弹（数字 ' + ans + '）！其他玩家各得 1 分';
            for (const p of GAME.curData.order) {
                if (p !== name) GAME.scores[p] = (GAME.scores[p] || 0) + 1;
            }
            broadcast({ type: 'game', sub: 'phase', phase: 'result', text: msg, scores: { ...GAME.scores } });
            renderGameResult(msg, GAME.scores);
            return;
        }
        // 缩小范围
        if (value < ans) GAME.curData.lo = Math.max(GAME.curData.lo, value + 1);
        else GAME.curData.hi = Math.min(GAME.curData.hi, value - 1);
        // 下一位
        GAME.curData.turnIdx = (GAME.curData.turnIdx + 1) % GAME.curData.order.length;
        GAME.curData.turn = GAME.curData.order[GAME.curData.turnIdx];
        broadcast({ type: 'game', sub: 'phase', phase: 'bomb-turn', round: GAME.roundIndex, total: GAME.totalRounds, lo: GAME.curData.lo, hi: GAME.curData.hi, turn: GAME.curData.turn, last: name + ' 猜了 ' + value });
        renderGameBomb('turn', GAME.curData.lo, GAME.curData.hi, GAME.curData.turn, name + ' 猜了 ' + value);
    }
    function hostBombSelfGuess(value) {
        hostBombGuess(null, myName, value);
    }

    // ---------- 房主：处理客户端动作 ----------
    function hostGameAction(conn, d) {
        const name = (conn.metadata && conn.metadata.name) || '访客';
        if (GAME.curGame === 'reaction' && d.action === 'tap' && !(name in GAME.collected)) {
            GAME.collected[name] = Date.now() - GAME.roundStart;
            if (Object.keys(GAME.collected).length >= Object.keys(connections).length + 1) {
                clearTimeout(GAME.timer);
                hostResolveReaction();
            }
        } else if (GAME.curGame === 'rps' && d.action === 'rps' && !(name in GAME.collected)) {
            GAME.collected[name] = d.value;
            if (Object.keys(GAME.collected).length >= Object.keys(connections).length) {
                clearTimeout(GAME.timer);
                hostResolveRps();
            }
        } else if (GAME.curGame === 'math' && d.action === 'answer' && !(name in GAME.collected)) {
            GAME.collected[name] = { value: d.value, t: Date.now() };
            if (d.value === GAME.curData.ans) {
                clearTimeout(GAME.timer);
                hostResolveMath();
            }
        } else if (GAME.curGame === 'draw') {
            if (d.action === 'guess' && name !== GAME.drawer && !GAME.collected.__winner__) {
                if ((d.value || '').trim() === GAME.word) {
                    GAME.collected.__winner__ = name;
                    clearTimeout(GAME.timer);
                    hostResolveDraw();
                } else {
                    // 转发错误猜测，让画手看到（房主端也要本地显示）
                    broadcast({ type: 'game', sub: 'phase', phase: 'wrong-guess', text: name + ' 猜「' + (d.value || '') + '」' });
                    const _wl = document.getElementById('draw-log'); if (_wl) _wl.textContent = name + ' 猜「' + (d.value || '') + '」';
                }
            } else if (d.action === 'stroke' && name === GAME.drawer) {
                drawAddSeg(d.value);
                broadcast({ type: 'game', sub: 'phase', phase: 'stroke', seg: d.value });
            } else if (d.action === 'clear' && name === GAME.drawer) {
                drawClear();
                broadcast({ type: 'game', sub: 'phase', phase: 'clear' });
            }
        } else if (GAME.curGame === 'bomb' && d.action === 'bomb-guess') {
            hostBombGuess(conn, name, parseInt(d.value, 10));
        }
    }

    // ---------- 客户端：处理房主广播 ----------
    function clientGameData(d) {
        if (d.sub === 'start') {
            GAME.active = true; GAME.roundIndex = 0; GAME.scores = d.scores || {}; GAME.curGame = null;
            renderGameStart(d.total);
        } else if (d.sub === 'round') {
            GAME.curGame = d.game; GAME.roundIndex = d.round; GAME.scores = d.scores || {}; GAME.myAnswer = null;
        } else if (d.sub === 'phase') {
            if (d.phase === 'go') { GAME.roundStart = d.ts; renderGameReaction('go'); }
            else if (d.phase === 'prepare') renderGameReaction('prepare');
            else if (d.phase === 'choose') renderGameRps('choose');
            else if (d.phase === 'question') renderGameMath('question', d.expr);
            else if (d.phase === 'draw-start') { GAME.drawer = d.drawer; renderGameDraw(GAME.drawer === myName ? 'drawer' : 'guesser', null); }
            else if (d.phase === 'you-draw') { GAME.drawer = myName; GAME.word = d.word; renderGameDraw('drawer', d.word); }
            else if (d.phase === 'stroke') drawAddSeg(d.seg);
            else if (d.phase === 'clear') drawClear();
            else if (d.phase === 'wrong-guess') { const el = document.getElementById('draw-log'); if (el) { el.textContent = d.text; } }
            else if (d.phase === 'bomb-turn') { if (d.round) GAME.roundIndex = d.round; if (d.total) GAME.totalRounds = d.total; renderGameBomb('turn', d.lo, d.hi, d.turn, d.last); }
            else if (d.phase === 'result') { GAME.scores = d.scores || GAME.scores; renderGameResult(d.text, GAME.scores); }
        } else if (d.sub === 'over') {
            GAME.active = false; renderGameOver(d.scores);
        }
    }

    // ---------- 玩家动作 ----------
    function playerAction(action, value) {
        const payload = { type: 'game', sub: 'action', action: action, value: value };
        if (isHost) {
            // 房主自己：直接处理
            const fake = { metadata: { name: myName } };
            hostGameActionSelf(action, value);
        } else {
            gameSend(payload);
        }
    }
    function hostGameActionSelf(action, value) {
        if (GAME.curGame === 'reaction' && action === 'tap' && !(myName in GAME.collected)) {
            GAME.collected[myName] = Date.now() - GAME.roundStart;
        } else if (GAME.curGame === 'rps' && action === 'rps' && !(myName in GAME.collected)) {
            GAME.collected[myName] = value;
        } else if (GAME.curGame === 'math' && action === 'answer' && !(myName in GAME.collected)) {
            GAME.collected[myName] = { value: value, t: Date.now() };
        } else if (GAME.curGame === 'draw') {
            if (action === 'guess' && myName !== GAME.drawer && !GAME.collected.__winner__) {
                if ((value || '').trim() === GAME.word) {
                    GAME.collected.__winner__ = myName;
                    clearTimeout(GAME.timer);
                    hostResolveDraw();
                } else {
                    broadcast({ type: 'game', sub: 'phase', phase: 'wrong-guess', text: myName + ' 猜「' + (value || '') + '」' });
                }
            } else if (action === 'stroke' && myName === GAME.drawer) {
                broadcast({ type: 'game', sub: 'phase', phase: 'stroke', seg: value });
            } else if (action === 'clear' && myName === GAME.drawer) {
                broadcast({ type: 'game', sub: 'phase', phase: 'clear' });
            }
        } else if (GAME.curGame === 'bomb' && action === 'bomb-guess') {
            hostBombSelfGuess(parseInt(value, 10));
        }
    }

        const hands = [['rock','✊ 石头'],['paper','✋ 布'],['scissors','✌️ 剪刀']];

        $('game-overlay').innerHTML = gameHeader(

    function renderGameMath(phase, expr) {
        gameOverlayShow();
        $('game-overlay').innerHTML = gameHeader(
            '<div class="px-5 pt-3 text-center text-xs text-space-muted font-mono">第 ' + GAME.roundIndex + '/' + GAME.totalRounds + ' 轮 · 速算抢答</div>' +
            '<div class="flex-1 flex flex-col items-center justify-center p-4">' +
            '<p class="text-4xl font-mono text-space-text mb-6">' + gEsc(expr) + ' = ?</p>' +
            '<input id="math-input" type="number" class="glow-input rounded-lg px-4 py-3 text-center text-xl w-40" autocomplete="off">' +
            '<button id="math-submit" class="mt-4 px-6 py-2.5 bg-glow-green/20 text-glow-green border border-glow-green/40 rounded-lg hover:bg-glow-green/30 transition">提交</button>' +
            '</div>');

            const v = parseInt($('math-input').value, 10);

        };
        $('math-submit').addEventListener('click', submit);
        $('math-input').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
        setTimeout(() => $('math-input') && $('math-input').focus(), 100);
    }


    // ============================================================
    // 你画我猜 画板
    // ============================================================
    let drawCtx = null, drawDrawing = false, drawLast = null, drawIsDrawer = false;

    function drawClear() {
        const cv = document.getElementById('draw-canvas');
        if (!cv || !drawCtx) return;
        drawCtx.clearRect(0, 0, cv.width, cv.height);
    }
    function drawAddSeg(seg) {
        const cv = document.getElementById('draw-canvas');
        if (!cv || !drawCtx || !seg) return;
        // seg = [x0,y0,x1,y1]（相对坐标 0..1）
        drawCtx.strokeStyle = '#f0f6fc';
        drawCtx.lineWidth = 3;
        drawCtx.lineCap = 'round';
        drawCtx.beginPath();
        drawCtx.moveTo(seg[0] * cv.width, seg[1] * cv.height);
        drawCtx.lineTo(seg[2] * cv.width, seg[3] * cv.height);
        drawCtx.stroke();
    }
    function drawInitCanvas() {
        const cv = document.getElementById('draw-canvas');
        if (!cv) return;
        const rect = cv.parentElement.getBoundingClientRect();
        cv.width = Math.floor(rect.width);
        cv.height = Math.floor(rect.height);
        drawCtx = cv.getContext('2d');
        drawCtx.fillStyle = '#0d1117';
        drawCtx.fillRect(0, 0, cv.width, cv.height);

        if (!drawIsDrawer) return;
        let last = null;
        const pos = (e) => {
            const r = cv.getBoundingClientRect();
            const p = e.touches ? e.touches[0] : e;
            return [ (p.clientX - r.left) / r.width, (p.clientY - r.top) / r.height ];
        };
        const down = (e) => { e.preventDefault(); drawDrawing = true; last = pos(e); };
        const move = (e) => {
            if (!drawDrawing) return;
            e.preventDefault();
            const cur = pos(e);
            const seg = [last[0], last[1], cur[0], cur[1]];
            drawAddSeg(seg);
            // 发送
            if (isHost) broadcast({ type: 'game', sub: 'phase', phase: 'stroke', seg: seg });
            else gameSend({ type: 'game', sub: 'action', action: 'stroke', value: seg });
            last = cur;
        };
        const up = () => { drawDrawing = false; };
        cv.addEventListener('mousedown', down);
        cv.addEventListener('mousemove', move);
        cv.addEventListener('mouseup', up);
        cv.addEventListener('mouseleave', up);
        cv.addEventListener('touchstart', down, { passive: false });
        cv.addEventListener('touchmove', move, { passive: false });
        cv.addEventListener('touchend', up);
    }

    function renderGameDraw(role, word) {
        gameOverlayShow();
        drawIsDrawer = (role === 'drawer');
        const header = '<div class="px-5 pt-3 text-center text-xs text-space-muted font-mono">第 ' + GAME.roundIndex + '/' + GAME.totalRounds + ' 轮 · 你画我猜</div>';
        let top;
        if (drawIsDrawer) {
            top = '<p class="text-center text-sm text-space-muted mt-1">你是画手，画：<span class="text-glow-green font-bold text-lg">' + gEsc(word || GAME.word || '') + '</span></p>';
        } else {
            top = '<p class="text-center text-sm text-space-muted mt-1">画手是 <span class="text-glow-blue font-semibold">' + gEsc(GAME.drawer || '') + '</span>，猜猜画的是什么</p>';
        }
        const inputArea = drawIsDrawer
            ? '<div class="flex justify-center gap-2 mt-2"><button id="draw-clear" class="px-4 py-1.5 bg-space-700 border border-space-border rounded-lg text-xs hover:border-glow-pink transition">清空</button></div>'
            : '<div class="flex gap-2 mt-2 px-4"><input id="draw-guess" class="glow-input flex-1 rounded-lg px-4 py-2 text-sm" placeholder="输入你猜的词，回车提交" autocomplete="off"><button id="draw-guess-btn" class="px-4 py-2 bg-glow-green/20 text-glow-green border border-glow-green/40 rounded-lg text-sm hover:bg-glow-green/30 transition">猜</button></div>';
        $('game-overlay').innerHTML = gameHeader(
            header + top +
            '<div class="flex-1 flex flex-col p-4 min-h-0">' +
            '<div class="flex-1 relative rounded-lg overflow-hidden border border-space-border bg-space-900"><canvas id="draw-canvas" class="absolute inset-0 w-full h-full' + (drawIsDrawer ? ' cursor-crosshair' : '') + '"></canvas></div>' +
            '<p id="draw-log" class="text-center text-xs text-space-muted mt-2 h-4"></p>' +
            inputArea +
            '</div>');
        $('game-close').addEventListener('click', () => gameOverlayHide());
        drawInitCanvas();
        if (drawIsDrawer) {
            $('draw-clear').addEventListener('click', () => {
                drawClear();
                if (isHost) broadcast({ type: 'game', sub: 'phase', phase: 'clear' });
                else gameSend({ type: 'game', sub: 'action', action: 'clear' });
            });
        } else {
            const submit = () => {
                const v = ($('draw-guess').value || '').trim();
                if (!v) return;
                $('draw-guess').value = '';
                if (isHost) hostGameActionSelf('guess', v);
                else gameSend({ type: 'game', sub: 'action', action: 'guess', value: v });
            };
            $('draw-guess-btn').addEventListener('click', submit);
            $('draw-guess').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
            setTimeout(() => $('draw-guess') && $('draw-guess').focus(), 100);
        }
    }

    // ============================================================
    // 数字炸弹
    // ============================================================
    function renderGameBomb(phase, lo, hi, turn, lastText) {
        gameOverlayShow();
        const isMyTurn = (turn === myName);
        const top = '<div class="px-5 pt-3 text-center text-xs text-space-muted font-mono">第 ' + GAME.roundIndex + '/' + GAME.totalRounds + ' 轮 · 数字炸弹</div>';
        const lastLine = lastText ? '<p class="text-center text-xs text-space-muted mt-2">' + gEsc(lastText) + '</p>' : '';
        const turnLine = '<p class="text-center mt-3">当前回合：<span class="' + (isMyTurn ? 'text-glow-green font-bold' : 'text-space-text') + '">' + gEsc(turn) + (isMyTurn ? '（你）' : '') + '</span></p>';
        const range = '<p class="text-center text-sm text-space-muted mt-1">范围：<span class="text-glow-blue font-mono">' + lo + ' ~ ' + hi + '</span></p>';
        const inputArea = isMyTurn
            ? '<div class="flex justify-center gap-2 mt-4"><input id="bomb-input" type="number" class="glow-input rounded-lg px-4 py-2 text-center w-32" min="' + lo + '" max="' + hi + '" autocomplete="off"><button id="bomb-btn" class="px-5 py-2 bg-glow-pink/20 text-glow-pink border border-glow-pink/40 rounded-lg text-sm hover:bg-glow-pink/30 transition">猜</button></div>'
            : '<p class="text-center text-xs text-space-muted mt-6">等待 ' + gEsc(turn) + ' 猜…</p>';
        $('game-overlay').innerHTML = gameHeader(
            top + lastLine + turnLine + range +
            '<div class="flex-1 flex flex-col items-center justify-center p-4">' +
            '<div class="text-5xl mb-4">💣</div>' +
            inputArea +
            '<p class="text-xs text-space-muted mt-4 text-center max-w-sm">1~100 之间有个炸弹数字，轮流猜。谁猜到炸弹，其他人各得 1 分</p>' +
            '</div>');
        $('game-close').addEventListener('click', () => gameOverlayHide());
        if (isMyTurn) {
            const submit = () => {
                const v = parseInt($('bomb-input').value, 10);
                if (isNaN(v) || v < lo || v > hi) return;
                $('bomb-btn').disabled = true;
                if (isHost) hostGameActionSelf('bomb-guess', v);
                else gameSend({ type: 'game', sub: 'action', action: 'bomb-guess', value: v });
            };
            $('bomb-btn').addEventListener('click', submit);
            $('bomb-input').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
            setTimeout(() => $('bomb-input') && $('bomb-input').focus(), 100);
        }
    }

    function renderGameResult(text, scores) {
        gameOverlayShow();
        $('game-overlay').innerHTML = gameHeader(
            '<div class="flex-1 flex flex-col items-center justify-center text-center p-6">' +
            '<p class="text-lg text-space-text mb-2">' + gEsc(text) + '</p>' +
            scoreboard(scores) +
            (isHost ? '<button id="next-round" class="mt-6 px-6 py-2.5 bg-glow-green/20 text-glow-green border border-glow-green/40 rounded-lg hover:bg-glow-green/30 transition">下一轮 →</button>' :
                '<p class="text-xs text-space-muted mt-6">等待房主开始下一轮…</p>') +
            '</div>');
        $('game-close').addEventListener('click', () => gameOverlayHide());
        if (isHost) {
            const nb = $('next-round');
            if (nb) nb.addEventListener('click', () => hostNextRound());
        }
    }

    function renderGameOver(scores) {
        gameOverlayShow();
        const arr = Object.keys(scores || {}).map(n => ({ n, s: scores[n] })).sort((a, b) => b.s - a.s);
        let champ;
        if (!arr.length) champ = '—';
        else if (arr.length > 1 && arr[0].s === arr[1].s) champ = '平局（' + arr[0].s + ' 分）';
        else champ = arr[0].n + '（' + arr[0].s + ' 分）';
        $('game-overlay').innerHTML = gameHeader(
            '<div class="flex-1 flex flex-col items-center justify-center text-center p-6">' +
            '<div class="text-5xl mb-3">🏆</div>' +
            '<h2 class="text-xl font-bold text-space-text mb-1">游戏结束</h2>' +
            '<p class="text-glow-green font-semibold mb-3">冠军：' + gEsc(champ) + '</p>' +
            scoreboard(scores) +
            '<button id="game-close2" class="mt-6 px-6 py-2.5 bg-space-700 border border-space-border rounded-lg hover:border-glow-green transition">关闭</button>' +
            '</div>');
        $('game-close').addEventListener('click', () => gameOverlayHide());
        $('game-close2').addEventListener('click', () => gameOverlayHide());
    }

    // ============================================================
    // 事件绑定 & 初始化
    // ============================================================
    $('create-btn').addEventListener('click', createRoom);
    $('refresh-btn').addEventListener('click', loadRooms);
    $('leave-btn').addEventListener('click', leaveRoom);
    $('send-btn').addEventListener('click', sendMsg);
    $('msg-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });
    $('game-btn').addEventListener('click', () => { if (isHost) hostStartGame(); else addSys('只有房主可以发起游戏'); });

    $('nickname').value = localStorage.getItem('lobby_nick') || '';

    loadRooms();
    setInterval(loadRooms, 10000); // 大厅每 10s 自动刷新

    // 关闭页面前清理（房主）：sendBeacon 尽力通知 Worker 注销房间
    window.addEventListener('beforeunload', () => {
        if (isHost && roomId) {
            try {
                navigator.sendBeacon(API_BASE + '/leave', new Blob([JSON.stringify({ code: roomId })], { type: 'application/json' }));
            } catch (e) {}
        }
    });
    </script>
</body>
</html>
