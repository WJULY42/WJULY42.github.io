<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚖️ BMI 计算器</title>
    <meta name="description" content="根据身高体重计算 BMI，并给出参考区间。">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    space: { 900: '#010409', 800: '#0d1117', 700: '#161b22', 600: '#21262d', border: '#30363d', text: '#f0f6fc', muted: '#8b949e' },
                    glow: { purple: '#8957e5', blue: '#58a6ff', pink: '#da3633', green: '#3fb950' }
                },
                fontFamily: {
                    sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Helvetica', 'Arial', 'sans-serif'],
                    mono: ['"JetBrains Mono"', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'],
                }
            }
        }
    }
</script>
    <style>
        * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        input[type="number"]::-webkit-outer-spin,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        .result-box { transition: all 0.25s ease; }
    </style>
</head>
<body class="bg-space-900 text-space-text font-sans antialiased min-h-screen flex flex-col">
    <main class="flex-1 flex flex-col items-center justify-center w-full p-4 md:p-6">
        <div class="w-full max-w-md">
            <p class="text-xs text-space-muted font-mono uppercase tracking-wider mb-2">// bmi</p>
            <div class="bg-space-700 border border-space-border rounded-xl p-6 shadow-2xl">
                <h1 class="text-xl font-bold mb-1">⚖️ BMI 计算器</h1>
                <p class="text-xs text-space-muted mb-6">Body Mass Index · 体质指数</p>

                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div>
                        <label for="height" class="block text-xs text-space-muted mb-2">身高 (cm)</label>
                        <input type="number" id="height" min="1" max="250" step="0.1" placeholder="175"
                               class="w-full bg-space-900 border border-space-border rounded-md px-3 py-2 outline-none focus:border-glow-blue text-sm font-mono">
                    </div>
                    <div>
                        <label for="weight" class="block text-xs text-space-muted mb-2">体重 (kg)</label>
                        <input type="number" id="weight" min="1" max="300" step="0.1" placeholder="70"
                               class="w-full bg-space-900 border border-space-border rounded-md px-3 py-2 outline-none focus:border-glow-blue text-sm font-mono">
                    </div>
                </div>

                <div class="flex gap-2 mb-6">
                    <button onclick="calculate()" class="flex-grow bg-glow-green/20 text-glow-green border border-glow-green/50 px-4 py-2 rounded-md text-sm font-medium hover:bg-glow-green/30 transition">
                        计算
                    </button>
                    <button onclick="clearAll()" class="flex-grow bg-space-600 border border-space-border text-space-text px-4 py-2 rounded-md text-sm font-medium hover:border-glow-pink hover:text-glow-pink transition">
                        清空
                    </button>
                </div>

                <div id="result" class="result-box hidden bg-space-900 border border-space-border rounded-lg p-5">
                    <div class="flex items-baseline justify-between mb-3">
                        <span class="text-xs text-space-muted font-mono uppercase tracking-wider">BMI</span>
                        <span id="bmi-value" class="text-4xl font-bold font-mono">--</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-space-muted">分类</span>
                        <span id="bmi-cat" class="text-sm font-semibold">--</span>
                    </div>
                    <div class="flex items-center justify-between mt-1">
                        <span class="text-xs text-space-muted">理想体重</span>
                        <span id="ideal-range" class="text-sm font-mono text-space-text">--</span>
                    </div>
                </div>

                <p id="hint" class="hidden text-xs text-space-muted mt-3"></p>
            </div>

            <p class="text-xs text-space-muted font-mono mt-4 text-center">参考：偏瘦 &lt;18.5 · 正常 18.5–24 · 超重 24–28 · 肥胖 ≥28</p>
        </div>
    </main>

    <script>
        const heightInput = document.getElementById('height');
        const weightInput = document.getElementById('weight');
        const resultBox   = document.getElementById('result');
        const bmiValue    = document.getElementById('bmi-value');
        const bmiCat      = document.getElementById('bmi-cat');
        const idealRange  = document.getElementById('ideal-range');
        const hint        = document.getElementById('hint');

        const CATS = [
            { name: '偏瘦', color: 'text-glow-blue',  border: 'border-glow-blue/50',  range: [0, 18.5] },
            { name: '正常', color: 'text-glow-green', border: 'border-glow-green/50', range: [18.5, 24] },
            { name: '超重', color: 'text-yellow-400', border: 'border-yellow-400/50', range: [24, 28] },
            { name: '肥胖', color: 'text-glow-pink',  border: 'border-glow-pink/50',  range: [28, Infinity] },
        ];

        function categorize(bmi) {
            for (const c of CATS) {
                if (bmi >= c.range[0] && bmi < c.range[1]) return c;
            }
            return CATS[CATS.length - 1];
        }

        function calculate() {
            const h = parseFloat(heightInput.value);
            const w = parseFloat(weightInput.value);

            if (!h || !w || h <= 0 || w <= 0) {
                hint.textContent = '请输入有效的身高和体重（数值需大于 0）。';
                hint.classList.remove('hidden');
                return;
            }
            if (h < 80 || h > 250) {
                hint.textContent = '身高看起来不太对，请输入 80–250 cm 之间的数值。';
                hint.classList.remove('hidden');
                return;
            }

            hint.classList.add('hidden');

            const meters = h / 100;
            const bmi = w / (meters * meters);
            const cat = categorize(bmi);

            // 理想体重区间 = 身高(m)² × [18.5, 24]
            const low = (meters * meters * 18.5).toFixed(1);
            const high = (meters * meters * 24).toFixed(1);

            bmiValue.textContent = bmi.toFixed(1);
            bmiValue.className = `text-4xl font-bold font-mono ${cat.color}`;
            bmiCat.textContent = cat.name;
            bmiCat.className = `text-sm font-semibold ${cat.color}`;
            idealRange.textContent = `${low} – ${high} kg`;

            resultBox.className = `result-box bg-space-900 border ${cat.border} rounded-lg p-5`;
            resultBox.classList.remove('hidden');
        }

        function clearAll() {
            heightInput.value = '';
            weightInput.value = '';
            bmiValue.textContent = '--';
            bmiValue.className = 'text-4xl font-bold font-mono';
            bmiCat.textContent = '--';
            bmiCat.className = 'text-sm font-semibold';
            idealRange.textContent = '--';
            resultBox.className = 'result-box bg-space-900 border border-space-border rounded-lg p-5';
            resultBox.classList.add('hidden');
            hint.classList.add('hidden');
            heightInput.focus();
        }

        [heightInput, weightInput].forEach(el => {
            el.addEventListener('keypress', (e) => { if (e.key === 'Enter') calculate(); });
        });

        // 记住上次的输入，方便复算
        const savedH = localStorage.getItem('lunar_bmi_h');
        const savedW = localStorage.getItem('lunar_bmi_w');
        if (savedH) heightInput.value = savedH;
        if (savedW) weightInput.value = savedW;

        const _origCalc = calculate;
        calculate = function () {
            _origCalc();
            localStorage.setItem('lunar_bmi_h', heightInput.value);
            localStorage.setItem('lunar_bmi_w', weightInput.value);
        };
    </script>
</body>
</html>
