<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍅 Pomodoro</title>
    <meta name="description" content="A 25 minute focus timer with a progress ring.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    space: { 900: '#010409', 800: '#0d1117', 700: '#161b22', 600: '#21262d', border: '#30363d', text: '#f0f6fc', muted: '#8b949e' },
                    glow: { purple: '#8957e5', blue: '#58a6ff', pink: '#da3633', green: '#3fb950' }
                },
                fontFamily: {
                    sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Helvetica', 'Arial', 'sans-serif'],
                    mono: ['"JetBrains Mono"', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'],
                }
            }
        }
    }
</script>
    <style>
        * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        .timer-ring { transform: rotate(-90deg); transform-origin: 50% 50%; }
    </style>



</head>
<body class="bg-space-900 text-space-text font-sans antialiased min-h-screen flex flex-col">
    <main class="flex-1 flex flex-col items-center justify-center w-full p-4 md:p-6">
        <div class="w-full max-w-md">
            <p class="text-xs text-space-muted font-mono uppercase tracking-wider mb-2">// focus</p>
            <div class="bg-space-700 border border-space-border rounded-xl p-6 shadow-2xl flex flex-col items-center">
                <div class="relative w-64 h-64 flex items-center justify-center">
                    <!-- 进度环 SVG -->
                    <svg class="absolute inset-0 w-full h-full timer-ring" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" class="text-space-border" stroke-width="4" />
                        <circle id="progress" cx="50" cy="50" r="45" fill="none" stroke="currentColor" class="text-glow-blue transition-all duration-1000" stroke-width="4" stroke-dasharray="283" stroke-dashoffset="0" stroke-linecap="round" />
                    </svg>
                    <div class="text-6xl font-bold z-10 font-mono" id="time-display">25:00</div>
                </div>

                <div class="mt-10 flex gap-4">
                    <button onclick="startTimer()" class="px-6 py-2 bg-glow-green/20 text-glow-green border border-glow-green/50 rounded-md font-bold hover:bg-glow-green/30 transition">Start</button>
                    <button onclick="resetTimer()" class="px-6 py-2 bg-space-600 border border-space-border rounded-md font-bold hover:bg-space-border transition">Reset</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let timerId = null;
        const display = document.getElementById('time-display');
        const progress = document.getElementById('progress');
        const circumference = 2 * Math.PI * 45;

        function updateDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            display.textContent = `${m}:${s}`;

            const offset = circumference - (timeLeft / totalTime) * circumference;
            progress.style.strokeDashoffset = offset;
        }

        function startTimer() {
            if(timerId) return;
            timerId = setInterval(() => {
                if(timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    clearInterval(timerId);
                    timerId = null;
                    alert("Focus session complete!");
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerId);
            timerId = null;
            timeLeft = 25 * 60;
            updateDisplay();
        }

        updateDisplay();
    </script>
</body>
</html>
