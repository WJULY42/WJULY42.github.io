<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ Text Chunker</title>
<meta name="description" content="将长文本按 40,000 字符自动切割并下载。">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    space: { 900: '#010409', 800: '#0d1117', 700: '#161b22', 600: '#21262d', border: '#30363d', text: '#f0f6fc', muted: '#8b949e' },
                    glow: { purple: '#8957e5', blue: '#58a6ff', pink: '#da3633', green: '#3fb950' }
                },
                fontFamily: {
                    sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Helvetica', 'Arial', 'sans-serif'],
                    mono: ['"JetBrains Mono"', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'],
                }
            }
        }
    }
</script>
<style>
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
</style>



</head>
<body class="bg-space-900 text-space-text font-sans antialiased min-h-screen flex flex-col">
    <main class="flex-1 flex flex-col items-center justify-center w-full p-4 md:p-6">
        <div class="w-full max-w-lg">
            <p class="text-xs text-space-muted font-mono uppercase tracking-wider mb-2">// chunk</p>
            <div class="bg-space-700 border border-space-border rounded-xl shadow-2xl p-6">
                <h1 class="text-2xl font-bold text-glow-blue mb-2">⚡ Text Chunker</h1>
                <p class="text-sm text-space-muted mb-6">将长文本按 40,000 字符自动切割并下载。</p>
                <p id="loaded-info" class="hidden text-sm text-glow-green mb-2"></p>
                <div id="drop-zone" class="drop-zone border-2 border-dashed border-space-border transition-all duration-300 rounded-lg p-10 text-center cursor-pointer mb-6">
                    <p class="text-space-muted">拖拽 .txt 文件到这里，或 <span class="text-glow-blue underline">点击选择</span></p>
                    <input type="file" id="file-input" class="hidden" accept=".txt,.md,.json">
                </div>
                <div id="result" class="space-y-3 hidden">
                    <h3 class="text-sm font-bold text-glow-green mb-2">🔪 切割完成！</h3>
                    <div id="download-list" class="space-y-2 max-h-60 overflow-y-auto"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const resultDiv = document.getElementById('result');
        const downloadList = document.getElementById('download-list');
        const loadedInfo = document.getElementById('loaded-info');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-glow-blue', 'bg-space-700'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-glow-blue', 'bg-space-700'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-glow-blue', 'bg-space-700');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFile(e.target.files[0]); });

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const text = e.target.result;
                const chunkSize = 40000;
                const chunks = [];

                // 核心切割逻辑
                for (let i = 0; i < text.length; i += chunkSize) {
                    chunks.push(text.substring(i, i + chunkSize));
                }

                downloadList.innerHTML = '';
                chunks.forEach((chunk, index) => {
                    const blob = new Blob([chunk], { type: 'text/plain;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${file.name.replace(/\.[^/.]+$/, "")}_part${index + 1}.txt`;
                    a.className = 'flex items-center justify-between p-3 bg-space-800 border border-space-border rounded-md hover:border-glow-blue transition text-sm';
                    a.innerHTML = `
                        <span class="truncate text-space-text">${a.download}</span>
                        <span class="text-space-muted ml-4 flex-shrink-0">${chunk.length} chars</span>
                    `;
                    downloadList.appendChild(a);
                });

                resultDiv.classList.remove('hidden');
                // 不能改 dropZone.innerHTML —— 那会连带销毁里面的 <input id="file-input">，
                // 让"点击选择"在加载第一个文件后就再也弹不出文件框。
                loadedInfo.textContent = `✅ 已加载: ${file.name} (${text.length} 字符)`;
                loadedInfo.classList.remove('hidden');
            };
            reader.readAsText(file, 'UTF-8');
        }
    </script>
</body>
</html>
