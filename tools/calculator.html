<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧮 Calculator</title>
    <meta name="description" content="A minimal calculator with keyboard support.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    space: { 900: '#010409', 800: '#0d1117', 700: '#161b22', 600: '#21262d', border: '#30363d', text: '#f0f6fc', muted: '#8b949e' },
                    glow: { purple: '#8957e5', blue: '#58a6ff', pink: '#da3633', green: '#3fb950' }
                },
                fontFamily: {
                    sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Helvetica', 'Arial', 'sans-serif'],
                    mono: ['"JetBrains Mono"', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'],
                }
            }
        }
    }
</script>
    <style>
        * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        .calc-btn { transition: all 0.1s; }
        .calc-btn:active { transform: scale(0.95); }
        /* 隐藏滚动条 */
        ::-webkit-scrollbar { display: none; }
    </style>



</head>
<body class="bg-space-900 text-space-text font-sans antialiased min-h-screen flex flex-col">
    <main class="flex-1 flex flex-col items-center justify-center w-full p-4 md:p-6">
        <div class="w-full max-w-sm">
            <p class="text-xs text-space-muted font-mono uppercase tracking-wider mb-2">// calc</p>
            <div class="bg-space-700 border border-space-border rounded-xl p-6 shadow-2xl">
                <!-- 显示屏 -->
                <input type="text" id="display" readonly class="w-full bg-space-900 border border-space-border rounded-lg p-4 text-right text-2xl mb-4 text-glow-blue outline-none font-mono" value="0">

                <!-- 键盘区 -->
                <div class="grid grid-cols-4 gap-3">
                    <button onclick="clearDisplay()" class="col-span-2 bg-glow-pink/20 text-glow-pink border border-glow-pink/50 rounded-lg p-3 font-bold hover:bg-glow-pink/30">C</button>
                    <button onclick="append('/')" class="bg-space-600 border border-space-border rounded-lg p-3 hover:border-glow-blue">÷</button>
                    <button onclick="append('*')" class="bg-space-600 border border-space-border rounded-lg p-3 hover:border-glow-blue">×</button>

                    <button onclick="append('7')" class="bg-space-600 border border-space-border rounded-lg p-3 hover:bg-space-border">7</button>
                    <button onclick="append('8')" class="bg-space-600 border border-space-border rounded-lg p-3 hover:bg-space-border">8</button>
                    <button onclick="append('9')" class="bg-space-600 border border-space-border rounded-lg p-3 hover:bg-space-border">9</button>
                    <button onclick="append('-')" class="bg-space-600 border border-space-border rounded-lg p-3 hover:border-glow-blue">-</button>

                    <button onclick="append('4')" class="bg-space-600 border border-space-border rounded-lg p-3 hover:bg-space-border">4</button>
                    <button onclick="append('5')" class="bg-space-600 border border-space-border rounded-lg p-3 hover:bg-space-border">5</button>
                    <button onclick="append('6')" class="bg-space-600 border border-space-border rounded-lg p-3 hover:bg-space-border">6</button>
                    <button onclick="append('+')" class="bg-space-600 border border-space-border rounded-lg p-3 hover:border-glow-blue">+</button>

                    <button onclick="append('1')" class="bg-space-600 border border-space-border rounded-lg p-3 hover:bg-space-border">1</button>
                    <button onclick="append('2')" class="bg-space-600 border border-space-border rounded-lg p-3 hover:bg-space-border">2</button>
                    <button onclick="append('3')" class="bg-space-600 border border-space-border rounded-lg p-3 hover:bg-space-border">3</button>
                    <button onclick="calculate()" class="row-span-2 bg-glow-green/20 text-glow-green border border-glow-green/50 rounded-lg p-3 font-bold hover:bg-glow-green/30">=</button>

                    <button onclick="append('0')" class="col-span-2 bg-space-600 border border-space-border rounded-lg p-3 hover:bg-space-border">0</button>
                    <button onclick="append('.')" class="bg-space-600 border border-space-border rounded-lg p-3 hover:bg-space-border">.</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const display = document.getElementById('display');
        function append(val) {
            // '0' is the idle placeholder; 'Error' must be wiped before the next digit
            if (display.value === '0' || display.value === 'Error') display.value = '';
            display.value += val;
        }
        function clearDisplay() { display.value = '0'; }
        function backspace() { display.value = display.value.slice(0, -1) || '0'; }
        function calculate() {
            try {
                display.value = String(eval(display.value));
            } catch {
                display.value = 'Error';
            }
        }

        // 键盘支持 — data/tools.json 里写了"支持键盘"，这里兑现它
        document.addEventListener('keydown', (e) => {
            const k = e.key;
            if (/^[0-9]$/.test(k)) { append(k); return; }
            if (k === '.' || k === '+' || k === '-' || k === '*') { append(k); return; }
            if (k === '/') { e.preventDefault(); append('/'); return; }  // Firefox 的 "/" 是快速查找
            if (k === 'Enter' || k === '=') { e.preventDefault(); calculate(); return; }
            if (k === 'Escape') { clearDisplay(); return; }
            if (k === 'Backspace') { e.preventDefault(); backspace(); return; }
            if (k === 'c' || k === 'C') { clearDisplay(); return; }
        });
    </script>
</body>
</html>
