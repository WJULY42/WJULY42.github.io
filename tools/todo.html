<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅ Todo List</title>
    <meta name="description" content="A small local-storage todo list.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    space: { 900: '#010409', 800: '#0d1117', 700: '#161b22', 600: '#21262d', border: '#30363d', text: '#f0f6fc', muted: '#8b949e' },
                    glow: { purple: '#8957e5', blue: '#58a6ff', pink: '#da3633', green: '#3fb950' }
                },
                fontFamily: {
                    sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Helvetica', 'Arial', 'sans-serif'],
                    mono: ['"JetBrains Mono"', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'],
                }
            }
        }
    }
</script>
    <style>
        * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        .task-item { transition: all 0.2s; }
    </style>



</head>
<body class="bg-space-900 text-space-text font-sans antialiased min-h-screen flex flex-col">
    <main class="flex-1 flex flex-col items-center justify-start w-full p-4 md:p-6">
        <div class="w-full max-w-md">
            <p class="text-xs text-space-muted font-mono uppercase tracking-wider mb-2">// tasks</p>
            <div class="bg-space-700 border border-space-border rounded-xl p-6 shadow-2xl">
                <div class="flex gap-2 mb-6">
                    <input type="text" id="input" placeholder="Add a new task..." class="flex-grow bg-space-900 border border-space-border rounded-md px-3 py-2 outline-none focus:border-glow-blue text-sm">
                    <button onclick="addTask()" class="bg-glow-green/20 text-glow-green border border-glow-green/50 px-4 py-2 rounded-md text-sm font-medium hover:bg-glow-green/30">Add</button>
                </div>
                <ul id="list" class="space-y-2">
                    <!-- Tasks will appear here -->
                </ul>
            </div>
        </div>
    </main>

    <script>
        const input = document.getElementById('input');
        const list = document.getElementById('list');

        // Load from local storage
        let tasks = JSON.parse(localStorage.getItem('lunar_tasks')) || [];
        render();

        function addTask() {
            if(!input.value.trim()) return;
            tasks.unshift({ text: input.value, done: false });
            save();
            input.value = '';
        }

        function toggle(index) {
            tasks[index].done = !tasks[index].done;
            save();
        }

        function remove(index) {
            tasks.splice(index, 1);
            save();
        }

        function save() {
            localStorage.setItem('lunar_tasks', JSON.stringify(tasks));
            render();
        }

        function render() {
            list.innerHTML = tasks.map((t, i) => `
                <li class="task-item flex items-center justify-between p-3 border border-space-border rounded-md hover:bg-space-700 ${t.done ? 'completed' : ''}">
                    <div class="flex items-center gap-3 cursor-pointer" onclick="toggle(${i})">
                        <svg class="check-icon w-5 h-5 ${t.done ? 'text-glow-green' : 'text-space-muted'}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${t.done ? 'M5 13l4 4L19 7' : 'M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z'}"></path></svg>
                        <span class="text-sm ${t.done ? 'line-through text-space-muted' : ''}">${t.text}</span>
                    </div>
                    <button onclick="remove(${i})" class="text-space-muted hover:text-glow-pink transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </li>
            `).join('');
        }

        input.addEventListener('keypress', (e) => { if(e.key === 'Enter') addTask(); });
    </script>
</body>
</html>
