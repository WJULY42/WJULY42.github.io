<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⏳ 倒数日</title>
    <meta name="description" content="记录重要日子，实时倒计时剩余天数、小时、分钟、秒。">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
      tailwind.config = {
          theme: {
              extend: {
                  colors: {
                      space: { 900: '#010409', 800: '#0d1117', 700: '#161b22', 600: '#21262d', border: '#30363d', text: '#f0f6fc', muted: '#8b949e' },
                      glow: { purple: '#8957e5', blue: '#58a6ff', pink: '#da3633', green: '#3fb950' }
                  },
                  fontFamily: {
                      sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Helvetica', 'Arial', 'sans-serif'],
                      mono: ['"JetBrains Mono"', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'],
                  }
              }
          }
      }
  </script>
    <style>
        * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        .field { transition: border-color 0.15s; }
        input[type="date"], input[type="time"] { color-scheme: dark; }
        .cd-card { animation: cd-in 0.25s ease; }
        @keyframes cd-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    </style>



</head>
<body class="bg-space-900 text-space-text font-sans antialiased min-h-screen flex flex-col">
    <main class="flex-1 flex flex-col items-center justify-start w-full p-4 md:p-6">
        <div class="w-full max-w-md">
            <p class="text-xs text-space-muted font-mono uppercase tracking-wider mb-2">// countdown</p>

            <!-- 主卡片 -->
            <div class="bg-space-700 border border-space-border rounded-xl p-6 shadow-2xl">
                <div class="flex items-center justify-between mb-6">
                    <h1 class="text-lg font-bold">⏳ 倒数日</h1>
                    <span class="text-[11px] font-mono px-2 py-1 rounded border border-space-border text-space-muted">共 <span id="cd-count">0</span> 个事件</span>
                </div>

                <!-- 添加表单 -->
                <div class="space-y-3 mb-4">
                    <input type="text" id="cd-name" maxlength="20" placeholder="事件名称，如：国庆假期" class="w-full field bg-space-900 border border-space-border rounded-md px-3 py-2 outline-none focus:border-glow-blue text-sm placeholder:text-space-muted">
                    <div class="flex gap-2">
                        <input type="date" id="cd-date" class="flex-grow field bg-space-900 border border-space-border rounded-md px-3 py-2 outline-none focus:border-glow-blue text-sm">
                        <input type="time" id="cd-time" class="flex-grow field bg-space-900 border border-space-border rounded-md px-3 py-2 outline-none focus:border-glow-blue text-sm font-mono">
                    </div>
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex gap-1.5 text-xs">
                            <button onclick="quickAdd(30)" class="px-2 py-1 rounded border border-space-border text-space-muted hover:text-glow-blue hover:border-glow-blue/50 transition">+30天</button>
                            <button onclick="quickAdd(60)" class="px-2 py-1 rounded border border-space-border text-space-muted hover:text-glow-blue hover:border-glow-blue/50 transition">+60天</button>
                            <button onclick="quickAdd(90)" class="px-2 py-1 rounded border border-space-border text-space-muted hover:text-glow-blue hover:border-glow-blue/50 transition">+90天</button>
                            <button onclick="quickAdd('newyear')" class="px-2 py-1 rounded border border-space-border text-space-muted hover:text-glow-blue hover:border-glow-blue/50 transition">新年</button>
                        </div>
                        <button onclick="saveEvent()" class="bg-glow-green/20 text-glow-green border border-glow-green/50 px-5 py-2 rounded-md text-sm font-bold hover:bg-glow-green/30 transition">保存</button>
                    </div>
                </div>

                <!-- 事件列表 -->
                <div class="border-t border-space-border pt-4">
                    <div id="cd-list" class="space-y-3"></div>
                </div>
            </div>

            <!-- 预置各色彩点：确保 Tailwind CDN 扫描到 bg-glow-* 类，事件为空时一并隐藏 -->
            <div id="color-seed" class="hidden">
                <span class="bg-glow-blue"></span><span class="bg-glow-green"></span>
                <span class="bg-glow-purple"></span><span class="bg-glow-pink"></span>
            </div>

            <p class="text-center text-xs text-space-muted font-mono mt-4">数据保存在本地浏览器（localStorage），不会上传到任何服务器</p>
        </div>
    </main>

    <script>
        // countdown —— 事件存在 localStorage，每秒刷新一次剩余时间
        const KEY = 'lunar_countdown';
        let events = [];

        const nameInput = document.getElementById('cd-name');
        const dateInput = document.getElementById('cd-date');
        const timeInput = document.getElementById('cd-time');
        const listEl = document.getElementById('cd-list');
        const countEl = document.getElementById('cd-count');

        const PALETTE = ['blue', 'green', 'purple', 'pink'];

        const pad = n => String(n).padStart(2, '0');

        // date input 的值是 UTC 字面量，按本地时区解释
        function toDateVal(s) {
            if (!s) return null;
            const [y, m, d] = s.split('-').map(Number);
            return new Date(y, m - 1, d, 0, 0, 0, 0).getTime();
        }

        function parseTarget() {
            const day = toDateVal(dateInput.value);
            if (day === null) return null;
            if (timeInput.value) {
                const [h, min] = timeInput.value.split(':').map(Number);
                const t = new Date();
                t.setFullYear(t.getFullYear(), 0, 0); // 仅用作容器
                return day + h * 3600000 + min * 60000;
            }
            return day;
        }

        function initDefaultDate() {
            const d = new Date();
            d.setDate(d.getDate() + 30);
            dateInput.value = d.toISOString().slice(0, 10);
            // 跨时区时 slice 可能差一天，用本地拼串更稳
            dateInput.value = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
            dateInput.min = new Date().getFullYear() + '-' + pad(new Date().getMonth() + 1) + '-' + pad(new Date().getDate());
            timeInput.value = '00:00';
        }

        function quickAdd(v) {
            const d = new Date();
            if (v === 'newyear') {
                const y = new Date().getFullYear() + 1;
                const ny = new Date(y, 0, 1);
                if (dateInput.value && parseTarget() > ny.getTime()) {
                    // 新年已过则跳到下一年
                    const ny2 = new Date(y + 1, 0, 1);
                    d = ny2;
                } else { d = ny; }
            } else {
                d.setDate(d.getDate() + Number(v));
            }
            dateInput.value = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
        }

        function load() {
            try {
                const raw = JSON.parse(localStorage.getItem(KEY) || '[]');
                events = Array.isArray(raw) ? raw.filter(e => e && typeof e.target === 'number' && typeof e.name === 'string') : [];
            } catch (err) {
                events = [];
            }
            events.sort((a, b) => a.target - b.target);
        }

        function persist() {
            localStorage.setItem(KEY, JSON.stringify(events));
            countEl.textContent = events.length;
        }

        function saveEvent() {
            const name = nameInput.value.trim();
            const target = parseTarget();
            if (!name) { alert('请输入事件名称'); nameInput.focus(); return; }
            if (target === null) { alert('请选择目标日期'); dateInput.focus(); return; }
            events.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), name, target, color: PALETTE[events.length % PALETTE.length] });
            events.sort((a, b) => a.target - b.target);
            persist();
            nameInput.value = '';
            timeInput.value = '00:00';
            render();
            nameInput.focus();
        }

        function removeEvent(id) {
            const ev = events.find(e => e.id === id);
            if (!ev) return;
            if (!confirm('确定删除「' + ev.name + '」吗？')) return;
            events = events.filter(e => e.id !== id);
            persist();
            render();
        }

        function daysLeft(target) {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const t = new Date(target);
            const td = new Date(t.getFullYear(), t.getMonth(), t.getDate());
            return Math.round((td - today) / 86400000);
        }

        function fmtTarget(ts) {
            const d = new Date(ts);
            const isToday = daysLeft(ts) === 0;
            const time = (d.getHours() || d.getMinutes()) ? pad(d.getHours()) + ':' + pad(d.getMinutes()) : '';
            if (isToday) return '今天' + (time ? ' ' + time : '');
            if (d.getFullYear() !== new Date().getFullYear()) {
                return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日' + (time ? ' ' + time : '');
            }
            return (d.getMonth() + 1) + '月' + d.getDate() + '日' + (time ? ' ' + time : '');
        }

        function render() {
            countEl.textContent = events.length;
            if (!events.length) {
                listEl.innerHTML = '<div class="text-center text-xs text-space-muted py-8 border border-dashed border-space-border rounded-lg">还没有倒数事件，在上方填写日期后点「保存」</div>';
                return;
            }

            listEl.innerHTML = events.map(ev => {
                const now = Date.now();
                let diff = ev.target - now;
                const passed = diff <= 0;
                diff = Math.abs(diff);
                const d = Math.floor(diff / 86400000);
                const h = Math.floor(diff / 3600000) % 24;
                const m = Math.floor(diff / 60000) % 60;
                const s = Math.floor(diff / 1000) % 60;

                const rel = passed ? ('已完成 ' + Math.abs(daysLeft(ev.target)) + ' 天')
                    : (daysLeft(ev.target) <= 0 ? '今天' : '还剩 ' + daysLeft(ev.target) + ' 天');

                return `
                <div class="cd-card bg-space-800 border border-space-border rounded-lg p-4" data-id="${ev.id}" data-target="${ev.target}">
                    <div class="flex items-center justify-between gap-3 mb-3">
                        <div class="min-w-0">
                            <div class="flex items-center gap-2 min-w-0">
                                <span class="w-1.5 h-1.5 rounded-full bg-glow-${ev.color} shrink-0"></span>
                                <h3 class="text-sm font-bold truncate">${escapeHtml(ev.name)}</h3>
                            </div>
                            <p class="text-[11px] text-space-muted font-mono mt-0.5 ml-3.5">${fmtTarget(ev.target)} &nbsp;·&nbsp; ${rel}</p>
                        </div>
                        <button onclick="removeEvent('${ev.id}')" title="删除事件" class="text-space-muted hover:text-glow-pink transition shrink-0">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>
                    <div class="grid grid-cols-4 gap-1.5">
                        ${cell(d, '天')} ${cell(h, '小时')} ${cell(m, '分')} ${cell(s, '秒')}
                    </div>
                    ${passed ? '<p class="text-[11px] text-glow-pink font-mono mt-2">⏰ 这个日子已经过去了</p>' : ''}
                </div>`;
            }).join('');
        }

        function cell(val, unit) {
            return `<div class="bg-space-900 border border-space-border rounded-md py-2 text-center">
                <div class="text-xl font-mono font-bold tabular-nums leading-none">${pad(val)}</div>
                <div class="text-[10px] text-space-muted mt-1">${unit}</div>
            </div>`;
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // 每秒刷新剩余时间
        setInterval(render, 1000);

        nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveEvent(); });
        dateInput.addEventListener('change', () => { dateInput.min = new Date().getFullYear() + '-' + pad(new Date().getMonth() + 1) + '-' + pad(new Date().getDate()); });

        initDefaultDate();
        load();
        render();
    </script>
</body>
</html>
