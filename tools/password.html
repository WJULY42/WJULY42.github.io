<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 密码生成器</title>
    <meta name="description" content="可自定义长度与字符集的安全密码生成器，附带强度提示。">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        space: { 900: '#010409', 800: '#0d1117', 700: '#161b22', 600: '#21262d', border: '#30363d', text: '#f0f6fc', muted: '#8b949e' },
                        glow: { purple: '#8957e5', blue: '#58a6ff', pink: '#da3633', green: '#3fb950' }
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Helvetica', 'Arial', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        input[type=range] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 9999px; background: #21262d; outline: none; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 16px; height: 16px; border-radius: 9999px;
            background: #58a6ff; cursor: pointer; border: 2px solid #010409;
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }
        input[type=range]::-moz-range-thumb {
            width: 16px; height: 16px; border-radius: 9999px;
            background: #58a6ff; cursor: pointer; border: 2px solid #010409;
        }
        .seg { transition: background-color 0.25s; }
        .reveal { animation: rev 0.2s ease-out; }
        @keyframes rev { from { opacity: 0.4; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-space-900 text-space-text font-sans antialiased min-h-screen flex flex-col">
    <main class="flex-1 flex flex-col items-center justify-start w-full p-4 md:p-6">
        <div class="w-full max-w-lg">
            <p class="text-xs text-space-muted font-mono uppercase tracking-wider mb-2">// password</p>
            <h1 class="text-xl font-semibold mb-4">🔐 密码生成器</h1>

            <div class="bg-space-700 border border-space-border rounded-xl p-6 shadow-2xl">
                <!-- 密码展示 -->
                <div id="passwordBox"
                     onclick="selectPassword()"
                     title="点击可选中密码"
                     class="bg-space-900 border border-space-border rounded-lg p-4 mb-4 cursor-text select-all">
                    <span id="passwordText" class="text-lg font-mono break-all text-space-muted">点击「生成」创建一个密码</span>
                </div>

                <!-- 强度指示 -->
                <div id="strengthWrap" class="mb-5 hidden">
                    <div class="flex gap-1.5 mb-1.5">
                        <div class="seg h-1.5 flex-1 rounded-full bg-space-600" data-i="0"></div>
                        <div class="seg h-1.5 flex-1 rounded-full bg-space-600" data-i="1"></div>
                        <div class="seg h-1.5 flex-1 rounded-full bg-space-600" data-i="2"></div>
                        <div class="seg h-1.5 flex-1 rounded-full bg-space-600" data-i="3"></div>
                    </div>
                    <p class="text-xs"><span id="strengthLabel" class="text-space-muted">—</span>
                       <span id="strengthEntropy" class="text-space-muted">· 0 bit</span></p>
                </div>

                <!-- 长度 -->
                <div class="mb-4">
                    <div class="flex justify-between items-baseline mb-2">
                        <span class="text-xs text-space-muted">密码长度</span>
                        <span><span id="lenVal" class="font-mono font-semibold text-glow-blue">16</span>
                              <span class="text-xs text-space-muted">位（4~64）</span></span>
                    </div>
                    <input type="range" id="len" min="4" max="64" value="16" class="w-full">
                </div>

                <!-- 字符集 -->
                <div class="grid grid-cols-2 gap-2 mb-5">
                    <label class="flex items-center gap-2 bg-space-900 border border-space-border rounded-md px-3 py-2 cursor-pointer hover:border-glow-blue/60">
                        <input type="checkbox" class="opt accent-glow-blue" value="upper" checked>
                        <span class="text-sm">大写字母</span>
                        <span class="text-xs text-space-muted font-mono ml-auto">A-Z</span>
                    </label>
                    <label class="flex items-center gap-2 bg-space-900 border border-space-border rounded-md px-3 py-2 cursor-pointer hover:border-glow-blue/60">
                        <input type="checkbox" class="opt accent-glow-blue" value="lower" checked>
                        <span class="text-sm">小写字母</span>
                        <span class="text-xs text-space-muted font-mono ml-auto">a-z</span>
                    </label>
                    <label class="flex items-center gap-2 bg-space-900 border border-space-border rounded-md px-3 py-2 cursor-pointer hover:border-glow-blue/60">
                        <input type="checkbox" class="opt accent-glow-blue" value="digits" checked>
                        <span class="text-sm">数字</span>
                        <span class="text-xs text-space-muted font-mono ml-auto">0-9</span>
                    </label>
                    <label class="flex items-center gap-2 bg-space-900 border border-space-border rounded-md px-3 py-2 cursor-pointer hover:border-glow-blue/60">
                        <input type="checkbox" class="opt accent-glow-blue" value="symbols">
                        <span class="text-sm">符号</span>
                        <span class="text-xs text-space-muted font-mono ml-auto">!@#…</span>
                    </label>
                </div>

                <!-- 操作按钮 -->
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="generatePassword()" class="bg-glow-green/20 text-glow-green border border-glow-green/50 rounded-md py-2 text-sm font-medium hover:bg-glow-green/30">生成</button>
                    <button onclick="copyPassword()" id="copyBtn" class="bg-glow-blue/20 text-glow-blue border border-glow-blue/50 rounded-md py-2 text-sm font-medium hover:bg-glow-blue/30">复制</button>
                </div>

                <p class="text-[11px] text-space-muted mt-4 leading-relaxed">密码仅在本地生成，不会上传。仅供个人使用。</p>
            </div>
        </div>
    </main>

    <script>
        const SETS = {
            upper:   'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            lower:   'abcdefghijklmnopqrstuvwxyz',
            digits:  '0123456789',
            symbols: '!@#$%^&*()-_=+[]{};:<>,.?/~'
        };
        const STRENGTH = [
            { label: '太弱',   color: '#da3633' },
            { label: '较弱',   color: '#f85149' },
            { label: '中等',   color: '#d29922' },
            { label: '强',     color: '#56d364' },
            { label: '非常强', color: '#3fb950' }
        ];

        const $len = document.getElementById('len');
        const $lenVal = document.getElementById('lenVal');
        const $text = document.getElementById('passwordText');
        const $box = document.getElementById('passwordBox');
        const $wrap = document.getElementById('strengthWrap');
        const $label = document.getElementById('strengthLabel');
        const $entropy = document.getElementById('strengthEntropy');
        const $copyBtn = document.getElementById('copyBtn');

        let currentPassword = '';

        $len.addEventListener('input', () => {
            $lenVal.textContent = $len.value;
        });

        // 首选密码学安全随机源，不可用时回退
        function secureRandomBytes(length) {
            const c = window.crypto;
            if (c && typeof c.getRandomValues === 'function') {
                return c.getRandomValues(new Uint32Array(length));
            }
            const arr = new Uint32Array(length);
            for (let i = 0; i < length; i++) arr[i] = Math.floor(Math.random() * 0xFFFFFFFF);
            return arr;
        }
        function selectedSets() {
            return [...document.querySelectorAll('.opt:checked')].map(el => el.value);
        }

        function generatePassword() {
            const length = parseInt($len.value, 10);
            const sets = selectedSets();
            if (sets.length === 0) {
                $text.textContent = '请至少勾选一种字符类型';
                $text.classList.remove('text-space-text');
                $text.classList.add('text-glow-pink');
                hideStrength();
                currentPassword = '';
                return;
            }

            const pool = sets.map(s => SETS[s]).join('');
            const rand = secureRandomBytes(length);
            const chars = new Array(length);
            for (let i = 0; i < length; i++) chars[i] = pool[rand[i] % pool.length];

            // 保证每种勾选类型至少出现一次，再整体打乱
            for (let i = 0; i < sets.length && i < length; i++) {
                const set = SETS[sets[i]];
                chars[i] = set[secureRandomBytes(1)[0] % set.length];
            }
            for (let i = chars.length - 1; i > 0; i--) {
                const j = secureRandomBytes(1)[0] % (i + 1);
                [chars[i], chars[j]] = [chars[j], chars[i]];
            }

            currentPassword = chars.join('');
            $text.textContent = currentPassword;
            $text.classList.remove('text-space-muted');
            $text.classList.add('text-space-text');
            $text.classList.remove('text-glow-pink');
            $text.classList.remove('reveal');
            void $text.offsetWidth; // 重启动画
            $text.classList.add('reveal');
            updateStrength(length, sets.length, pool.length);
        }

        function updateStrength(length, variety, poolSize) {
            $wrap.classList.remove('hidden');
            const entropy = Math.round(length * Math.log2(poolSize));
            let score;
            if (entropy < 28) score = 0;
            else if (entropy < 45) score = 1;
            else if (entropy < 70) score = 2;
            else if (entropy < 90) score = 3;
            else score = 4;
            if (variety <= 1) score = Math.min(score, 1);

            const meta = STRENGTH[score];
            $label.textContent = `强度：${meta.label}`;
            $label.style.color = meta.color;
            $entropy.textContent = `· ${entropy} bit`;

            document.querySelectorAll('.seg').forEach(el => {
                el.style.backgroundColor =
                    parseInt(el.dataset.i, 10) <= score ? meta.color : '#21262d';
            });
        }

        function hideStrength() {
            $wrap.classList.add('hidden');
            document.querySelectorAll('.seg').forEach(el => el.style.backgroundColor = '#21262d');
        }

        async function copyPassword() {
            if (!currentPassword) {
                $text.textContent = '先「生成」一个密码';
                $text.classList.add('text-glow-pink');
                return;
            }
            const ok = await copyToClipboard(currentPassword);
            if (ok) {
                $copyBtn.textContent = '已复制 ✓';
                setTimeout(() => { $copyBtn.textContent = '复制'; }, 1200);
            } else {
                $copyBtn.textContent = '复制失败';
                setTimeout(() => { $copyBtn.textContent = '复制'; }, 1600);
            }
        }

        // 点击密码框选中全部文本，方便手动复制
        function selectPassword() {
            const range = document.createRange();
            range.selectNodeContents($text);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        }

        // 兼容非安全上下文（file:// / 本地访问）
        async function copyToClipboard(text) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch {}
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.top = '0';
                ta.style.left = '0';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch {
                return false;
            }
        }

        // 打开页面自动出一个示例密码
        generatePassword();
    </script>
</body>
</html>
